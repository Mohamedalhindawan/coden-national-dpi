name: Architecture Visual QA

on:
  pull_request:
    paths:
      - "design-system/boards/**/*.svg"
      - "scripts/qa_architecture_boards.py"
      - ".github/workflows/architecture-visual-qa.yml"
  push:
    branches: [main]
    paths:
      - "design-system/boards/**/*.svg"
      - "scripts/qa_architecture_boards.py"
      - ".github/workflows/architecture-visual-qa.yml"

permissions:
  contents: read

jobs:
  svg-quality-gate:
    name: SVG structure, accessibility and legibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate architecture boards
        run: python scripts/qa_architecture_boards.py
