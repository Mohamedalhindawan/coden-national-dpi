name: V4 Progress Validator
on:
  pull_request:
    paths:
      - 'scripts/validate_v4_progress.py'
      - 'tests/test_v4_progress.py'
      - '.github/workflows/v4-progress-validator.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run V4 progress tests
        run: python -m unittest discover -s tests -p 'test_v4_progress.py' -v
