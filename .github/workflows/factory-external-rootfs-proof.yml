name: CODEN P0 bounded external rootfs feasibility
on:
  pull_request:
    paths: ['.github/workflows/factory-external-rootfs-proof.yml']
permissions: {}
jobs:
  external-rootfs-synthetic:
    if: github.event.repository.private == false && github.head_ref == 'feat/factory-acceleration-batch01-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      BASE: docker.io/library/ubuntu@sha256:9a04f13b3f80ef056361e30868593b1cfd2279fe19e4081cb93a90bf56819d6a
    steps:
      - name: Test supported external rootfs without installing real packages
        run: |
          set -euo pipefail
          mkdir -m 0700 evidence
          test "$(id -u)" -ne 0
          podman info --format json | jq -e '.host.security.rootless == true and .host.cgroupVersion == "v2"' >/dev/null
          podman pull --platform linux/amd64 "$BASE"
          printf '%s\n' '{"synthetic_only":true,"real_deb_installation":false,"os_attempt_consumed":false,"release_authorized":false}' > evidence/scope.json
          # Only setup/cleanup of our own tmpfs is done in the rootless user namespace.
          # No sudo, host-root mount, host proc/dev binding, host service socket or real deb.
          podman unshare bash -s -- "$BASE" "$PWD/evidence" "coden-rootfs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'SH'
          set -euo pipefail
          base=$1
          evidence=$2
          name=$3
          test "$(id -u)" = 0
          awk 'NR==1{exit !($1==0 && $2!=0)}' /proc/self/uid_map
          cat /proc/self/uid_map > "$evidence/setup-uid-map.txt"
          work=$(mktemp -d)
          root="$work/root"
          mkdir "$root"
          logpath="$work/runtime.log"
          mounted=false
          image_mounted=false
          cleanup() {
            rc=$?
            trap - EXIT
            timeout 20s podman rm -f --ignore "$name" >/dev/null 2>&1 || rc=1
            if podman container exists "$name"; then rc=1; fi
            if "$image_mounted"; then timeout 20s podman image unmount "$base" >/dev/null || rc=1; fi
            if "$mounted"; then timeout 20s umount "$root" || rc=1; fi
            if mountpoint -q "$root"; then rc=1; else rmdir "$root" || rc=1; fi
            rm -f -- "$logpath" "$work/mount-check.awk"
            rmdir "$work" || rc=1
            printf 'final_exit_code=%s\n' "$rc" > "$evidence/exit.txt"
            # Cleanup evidence is separate from the probe result.
            if ! podman container exists "$name" && ! mountpoint -q "$root" && test ! -e "$work"; then
              echo resources_removed > "$evidence/cleanup.txt"
            else
              echo cleanup_unverified > "$evidence/cleanup.txt"
              rc=1
              printf 'final_exit_code=%s\n' "$rc" > "$evidence/exit.txt"
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          mount -t tmpfs -o size=768m,nr_inodes=49152,nosuid,nodev,mode=0755 tmpfs "$root"
          mounted=true
          test "$(df -Pk "$root" | awk 'NR==2{print $2}')" = 786432
          test "$(df -Pi "$root" | awk 'NR==2{print $2}')" = 49152
          findmnt -n -o FSTYPE,OPTIONS --target "$root" > "$evidence/setup-rootfs-mount.txt"
          source=$(podman image mount "$base")
          image_mounted=true
          test -d "$source" && test "$source" != /
          test -z "$(find "$source" -xdev \( -type b -o -type c -o -type s -o -type p \) -print -quit)"
          timeout 60s cp -a "$source/." "$root/"
          test -f "$root/var/lib/dpkg/status"
          sha256sum "$root/var/lib/dpkg/status" | awk '{print $1}' > "$evidence/status.before"
          timeout 20s podman image unmount "$base" >/dev/null
          image_mounted=false
          df -Pk "$root" > "$evidence/setup-blocks.txt"
          df -Pi "$root" > "$evidence/setup-inodes.txt"
          podman version --format json > "$evidence/podman-version.json"
          podman create --name "$name" --network none --http-proxy=false \
            --read-only-tmpfs=false --cap-drop=all --cap-add=CHOWN,DAC_OVERRIDE,FOWNER,SYS_CHROOT \
            --security-opt=no-new-privileges --user 0:0 \
            --cpus=2 --memory=4096m --memory-swap=4096m --pids-limit=128 \
            --cgroupns=private --pid=private --ipc=none --timeout=60 \
            --no-hosts --security-opt=mask=/etc/hostname:/run/.containerenv \
            --tmpfs /dev:ro,nosuid,noexec,size=64m,mode=0755 \
            --ulimit core=0:0 --ulimit nofile=256:256 --ulimit msgqueue=65536:65536 --ulimit memlock=0:0 \
            --log-driver=k8s-file --log-opt max-size=1mb --log-opt "path=$logpath" \
            --rootfs "$root" /bin/sh -eu -c '
              test "$(id -u)" = 0
              awk "NR==1{exit !(\$1==0 && \$2!=0)}" /proc/self/uid_map
              test "$(cat /sys/fs/cgroup/cpu.max)" = "200000 100000"
              test "$(cat /sys/fs/cgroup/memory.max)" = "4294967296"
              test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
              test "$(cat /sys/fs/cgroup/pids.max)" = 128
              grep -Eq "^CapEff:[[:space:]]+000000000004000b$" /proc/self/status
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              test "$(ls /sys/class/net | tr "\n" " ")" = "lo "
              test "$(df -Pk / | awk "NR==2{print \$2}")" = 786432
              test "$(df -Pi / | awk "NR==2{print \$2}")" = 49152
              awk "\$5==\"/\" && \$0 ~ / - tmpfs / {ok=1} END{exit !ok}" /proc/self/mountinfo
              # Record evidence before checks; never write to a possibly external metadata mount.
              cat /proc/self/mountinfo
              df -Pk
              df -Pi
              test -c /dev/null
              # The visible masks must be null devices; host-side mount graph checks verify their parents.
              test ! -L /etc/hosts
              if test -e /etc/hosts; then
                test -f /etc/hosts
                test "$(stat -c %d /etc/hosts)" = "$(stat -c %d /)"
              fi
              for path in /etc/hostname /run/.containerenv; do
                test ! -L "$path" && test -c "$path"
                test "$(stat -c "%t:%T" "$path")" = "1:3"
                printf "METADATA_NULL_DEVICE %s\n" "$path"
              done
              printf "GENERATED_METADATA_QUOTA_OR_READONLY_PASS\n"
              printf test > /dev/null
              test -r /proc/1/stat
              test ! -e /run/podman/podman.sock && test ! -e /var/run/docker.sock
              test -z "$(find /dev -xdev -type b -print)"
              for ns in ipc pid net mnt cgroup; do printf "NS %s %s\n" "$ns" "$(readlink "/proc/self/ns/$ns")"; done
              # /run must share root quota; /dev must deny ordinary file writes.
              test "$(stat -c %d /run)" = "$(stat -c %d /)"
              if touch /dev/coden-write-probe 2>/dev/null; then rm /dev/coden-write-probe; exit 25; fi
              if test -d /dev/shm; then
                if touch /dev/shm/coden-write-probe 2>/dev/null; then rm /dev/shm/coden-write-probe; exit 26; fi
              fi
              printf run-probe > /run/coden-quota-probe
              test "$(cat /run/coden-quota-probe)" = run-probe
              rm /run/coden-quota-probe
              test -z "$(find / -xdev \( -type b -o -type c \) -print -quit)"
              printf "AUXILIARY_WRITES_RESTRICTED_PASS\n"
              df -Pk
              df -Pi
              printf synthetic > /tmp/coden-rootfs-probe
              test "$(cat /tmp/coden-rootfs-probe)" = synthetic
              test -z "$(dpkg --audit)"
              rc=0
              ischroot || rc=$?
              case "$rc" in 0|1|2) ;; *) exit 21;; esac
              printf "OCI_ISCHROOT_EXIT=%s\n" "$rc"
              for path in /sbin/init /sbin/telinit /run/systemd/system; do if test -e "$path" || test -L "$path"; then printf "INIT_PATH_PRESENT %s\n" "$path"; else printf "INIT_PATH_ABSENT %s\n" "$path"; fi; done
              # Synthetic package lifecycle on this actual OCI root, not the old nested chroot.
              # Every package, staging directory, cache, and generated file stays on the root tmpfs.
              stage=$(mktemp -d /tmp/coden-oci-dpkg.XXXXXX)
              trap "rm -rf -- \"$stage\"" EXIT
              mkdir -p "$stage/pkg/DEBIAN" "$stage/pkg/usr/share/coden-oci-preflight"
              mkdir "$stage/build-tmp"
              for path in "$stage" "$stage/build-tmp" /var/lib/dpkg /tmp /run; do
                test "$(stat -c %d "$path")" = "$(stat -c %d /)"
              done
              test "$(dpkg-query -W -f="\${Version}" libc6)" = 2.39-0ubuntu8.9
              test "$(dpkg-query -W -f="\${Version}" libc-bin)" = 2.39-0ubuntu8.9
              dpkg-query -W -f="\${Package} \${Version} \${db:Status-Abbrev}\n" | sort > "$stage/packages.before"
              for v in 1 2; do
                printf "Package: coden-oci-preflight\nVersion: %s\nArchitecture: all\nMaintainer: CODEN Test <test@example.invalid>\nDescription: harmless synthetic OCI lifecycle probe\n" "$v" > "$stage/pkg/DEBIAN/control"
                printf "%s\n" "$v" > "$stage/pkg/usr/share/coden-oci-preflight/version"
                printf "#!/bin/sh\nset -eu\ntest -c /dev/null\nprintf synthetic > /dev/null\ntest -r /proc/1/stat\ntest ! -e /sbin/init\ntest ! -e /sbin/telinit\nprintf configured > /tmp/coden-oci-maintainer-probe\n" > "$stage/pkg/DEBIAN/postinst"
                chmod 0755 "$stage/pkg/DEBIAN/postinst"
                TMPDIR="$stage/build-tmp" dpkg-deb --build --root-owner-group "$stage/pkg" "$stage/probe-$v.deb"
                TMPDIR=/tmp dpkg -i "$stage/probe-$v.deb"
                test "$(dpkg-query -W -f="\${Version}" coden-oci-preflight)" = "$v"
                test "$(cat /usr/share/coden-oci-preflight/version)" = "$v"
                test "$(cat /tmp/coden-oci-maintainer-probe)" = configured
                rm /tmp/coden-oci-maintainer-probe
              done
              dpkg --purge coden-oci-preflight
              test ! -e /usr/share/coden-oci-preflight/version
              test -z "$(dpkg --audit)"
              dpkg-query -W -f="\${Package} \${Version} \${db:Status-Abbrev}\n" | sort > "$stage/packages.after"
              cmp "$stage/packages.before" "$stage/packages.after"
              printf "OCI_SYNTHETIC_DPKG_LIFECYCLE_PASS\n"
              printf "OCI_PACKAGE_INVENTORY_UNCHANGED_PASS\n"
              rm -rf -- "$stage"
              trap - EXIT
              printf "EXTERNAL_ROOTFS_SYNTHETIC_PASS\n"
            ' >/dev/null
          podman inspect "$name" | jq -e '.[0] | .HostConfig.Privileged==false and .HostConfig.ReadonlyRootfs==false and .HostConfig.NetworkMode=="none" and ([.Mounts[]? | select(.Type=="bind")]|length==0)' >/dev/null
          for ns in ipc pid net mnt cgroup; do printf "NS %s %s\n" "$ns" "$(readlink "/proc/self/ns/$ns")"; done > "$evidence/setup-namespaces.txt"
          podman start "$name" >/dev/null
          timeout 75s podman wait "$name" > "$evidence/container-exit.txt"
          podman logs "$name" > "$evidence/probe.log" 2>&1
          test "$(cat "$evidence/container-exit.txt")" = 0
          grep -qx EXTERNAL_ROOTFS_SYNTHETIC_PASS "$evidence/probe.log"
          grep -qx OCI_SYNTHETIC_DPKG_LIFECYCLE_PASS "$evidence/probe.log"
          grep -qx OCI_PACKAGE_INVENTORY_UNCHANGED_PASS "$evidence/probe.log"
          grep -qx AUXILIARY_WRITES_RESTRICTED_PASS "$evidence/probe.log"
          grep -qx GENERATED_METADATA_QUOTA_OR_READONLY_PASS "$evidence/probe.log"
          # Reject any extra writable ordinary-file mount, including generated single-file binds.
          # Standard character-device bind mounts and kernel pseudo-filesystems are classified
          # separately; their kernel-resource accounting is not inferred from this check.
          checker="$work/mount-check.awk"
          cat > "$checker" <<'AWK'
          BEGIN {
            expected["/"]="tmpfs"; expected["/proc"]="proc"
            split("null zero full tty random urandom", d, " ")
            for(i in d) expected["/dev/" d[i]]="devtmpfs"
            metadata["/etc/hostname"]="hostname"; metadata["/run/.containerenv"]=".containerenv"
          }
          $1~/^[0-9]+$/ && $2~/^[0-9]+$/ && $3~/^[0-9]+:[0-9]+$/ {
            path=$5; id=$1; if(++ids[id]!=1) bad=1
            fs=""; for(i=7;i<NF;i++) if($i=="-"){fs=$(i+1);break}
            rw=($6~/(^|,)rw(,|$)/); ro=($6~/(^|,)ro(,|$)/)
            if(fs=="" || rw==ro) bad=1
            if(path in metadata) {
              count[path]++
              if(rw && fs=="tmpfs" && $4 ~ ("^/containers/overlay-containers/[0-9a-f]+/userdata/" metadata[path] "$") && $4 !~ /\/\.\.?\//) {if(++lowCount[path]!=1)bad=1; low[path]=id; lowParent[path]=$2}
              else if(ro && fs=="devtmpfs" && $4=="/null") {if(++topCount[path]!=1)bad=1; topParent[path]=$2; topDev[path]=$3}
              else {print "unexpected metadata mount",path,fs,$6;bad=1}
              next
            }
            if(++seen[path]!=1)bad=1
            if(rw) {
              if(!(path in expected)||expected[path]!=fs){print "unexpected writable mount",path,fs;bad=1}
              else {writable[path]=1;print path,fs,$6; if(path=="/")rootId=id; if(path=="/dev/null")nullDev=$3}
            } else if(ro) readonly[path]=1
          }
          END {
            for(path in expected) if(!writable[path]){print "missing expected mount",path;bad=1}
            for(path in metadata) {
              if(count[path]!=2 || lowCount[path]!=1 || topCount[path]!=1 || lowParent[path]!=rootId || topParent[path]!=low[path] || topDev[path]!=nullDev){print "unproven metadata cover",path;bad=1}
              else print "masked metadata",path,"lower",low[path],"cover-parent",topParent[path]
            }
            if(!readonly["/dev"]||!readonly["/proc/sys"]||!readonly["/sys/fs/cgroup"])bad=1
            exit (bad?1:0)
          }
          AWK
          awk -f "$checker" "$evidence/probe.log" > "$evidence/writable-mounts.txt"
          if { cat "$evidence/probe.log"; printf '\n999 399 0:99 / /unexpected rw - ext4 ext4 rw\n'; } | awk -f "$checker" > "$evidence/mount-negative-extra.txt"; then exit 22; fi
          if grep -v ' / rw,' "$evidence/probe.log" | awk -f "$checker" > "$evidence/mount-negative-missing.txt"; then exit 23; fi
          if grep -v ' /null /etc/hostname ro,' "$evidence/probe.log" | awk -f "$checker" > "$evidence/mount-negative-cover.txt"; then exit 27; fi
          if sed 's@ /null /etc/hostname ro,@ /null /etc/hostname rw,@' "$evidence/probe.log" | awk -f "$checker" > "$evidence/mount-negative-cover-rw.txt"; then exit 28; fi
          rm -f "$checker"
          printf '%s\n' '{"ordinary_writable_tmpfs_capacity_kib":786432,"ordinary_writable_tmpfs_inodes":49152,"ordinary_writable_mounts_checked":1,"dev_readonly_verified":true,"run_shares_root_quota":true,"negative_cases_rejected":4,"masked_generated_metadata_verified":true,"staging_and_kernel_accounting_complete":false,"aggregate_writable_budget_proven":false,"actual_installation_allowed":false}' > "$evidence/quota-review.json"
          for ns in ipc pid net mnt cgroup; do
            h=$(awk -v n="$ns" '$2==n && $1=="NS"{print $3}' "$evidence/setup-namespaces.txt")
            c=$(awk -v n="$ns" '$2==n && $1=="NS"{print $3}' "$evidence/probe.log")
            test -n "$h" && test -n "$c" && test "$h" != "$c"
          done
          test "$(cat "$root/tmp/coden-rootfs-probe")" = synthetic
          sha256sum "$root/var/lib/dpkg/status" | awk '{print $1}' > "$evidence/status.after"
          # Physical dpkg status may be reserialized; the complete package inventory is compared inside OCI.
          if cmp -s "$evidence/status.before" "$evidence/status.after"; then echo identical > "$evidence/status-comparison.txt"; else echo reserialized_or_changed > "$evidence/status-comparison.txt"; fi
          test -f "$logpath" && test ! -L "$logpath"
          test "$(stat -c %s "$logpath")" -le 1048576
          printf '%s\n' '{"external_rootfs_feasibility_pass":true,"synthetic_dpkg_lifecycle_verified":true,"package_inventory_unchanged":true,"real_glibc_installation":false,"rootfs_tmpfs_bytes":805306368,"rootfs_tmpfs_inodes":49152,"private_proc_and_dev_observed":true,"namespace_identity_checks":5,"actual_installation_allowed":false,"aggregate_writable_budget_proven":false,"real_glibc_scripts_executed":false,"release_authorized":false}' > "$evidence/review.json"
          SH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-external-rootfs-proof
          path: evidence/
          if-no-files-found: error
          retention-days: 7
