name: CODEN P0 exact source distribution notice review
on:
  pull_request:
    paths: ['.github/workflows/factory-exact-sdist-review.yml']
permissions: {}
jobs:
  static-review:
    if: github.event.repository.private == false && github.head_ref == 'audit/factory-p0-runtime-dependency-remediation-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Collect exact source notices and build metadata without executing or extracting archives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, tarfile, tomllib, zipfile
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlsplit
          from urllib.request import build_opener, HTTPRedirectHandler
          archive = Path("docs/evidence/openhands-077f3fad/fixed-source-provenance.zip")
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == "a86bac8c435a835697d8cfe3cee1f8c38ab4a99591b5af1fba6698686bfb7fd8"
          with zipfile.ZipFile(archive) as z:
              raw = z.read("resolved.lock")
          assert hashlib.sha256(raw).hexdigest() == "6d8348da6768ae32bb7665bdc7ca2525d53e576e13729fcc41f0a28df7c25b69"
          expected = {
              "func-timeout": ("4.3.5", "74cd3c428ec94f4edfba81f9b2f14904846d5ffccc27c92433b8b5939b5575dd"),
              "browser-use-sdk": ("2.0.15", "0832ae0998736e6386457e6cf506e2820db0d626c4d9dbf0f567ea2b6c6888d3"),
              "lmnr-claude-code-proxy": ("0.1.23", "6d8fa044c2f5774a6b70de9025a91c13c74361d4349ae528b4b4fcca48219a13")
          }
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError("redirect denied")
          records = {}
          for p in tomllib.loads(raw.decode())["package"]:
              name = p["name"]
              if name not in expected:
                  continue
              version, digest = expected[name]
              assert p["version"] == version and name not in records
              s = p["sdist"]
              u = urlsplit(s["url"])
              assert u.scheme == "https" and u.netloc == "files.pythonhosted.org" and u.path.endswith(".tar.gz") and not u.query and not u.fragment
              assert s["hash"] == "sha256:" + digest and s["size"] <= 1024*1024
              with build_opener(NoRedirect()).open(s["url"], timeout=30) as response:
                  data = response.read(1024*1024+1)
              assert len(data) == s["size"] and hashlib.sha256(data).hexdigest() == digest
              files = {}
              index = []
              seen = set()
              total = 0
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tar:
                  for member in tar:
                      q = PurePosixPath(member.name)
                      assert not q.is_absolute() and ".." not in q.parts and "\\" not in member.name and member.name not in seen
                      assert member.isfile() or member.isdir()
                      seen.add(member.name)
                      total += member.size
                      assert len(seen) <= 5000 and total <= 16*1024*1024
                      if not member.isfile():
                          continue
                      index.append({"path":member.name,"size":member.size})
                      key = q.name.lower()
                      if key.startswith(("license","licence","notice","copying","copyright","readme")) or key in ("pkg-info","pyproject.toml","setup.py","setup.cfg","cargo.toml","cargo.lock"):
                          assert member.size <= 1024*1024
                          evidence = tar.extractfile(member).read()
                          files[member.name] = {"sha256":hashlib.sha256(evidence).hexdigest(),"base64":base64.b64encode(evidence).decode()}
              records[name] = {"version":version,"source_sha256":digest,"source_url":s["url"],"source_size":len(data),"wheel_candidates":len(p.get("wheels",[])),"files":files,"index":index}
              print("Verified exact source archive:", name, version, "files", len(index), "review records", len(files))
          assert set(records) == set(expected)
          Path("sdist-review.json").write_text(json.dumps({"status":"static_evidence_only","records":records,"source_executed":False,"installed":False,"wheel_built":False,"license_approved":False,"release_authorized":False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-sdist-review
          path: sdist-review.json
          if-no-files-found: error
          retention-days: 7
