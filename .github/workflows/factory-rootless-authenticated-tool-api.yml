name: CODEN P0 Real Authenticated Rootless OpenHands Bash Tool API

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/factory-rootless-authenticated-tool-api.yml'
      - 'ai_factory/factory_rootless_tool_api_proof.py'
      - 'tests/test_factory_rootless_tool_api.py'
      - 'docs/FACTORY_ROOTLESS_AUTHENTICATED_TOOL_API.md'

permissions:
  contents: read
  actions: read

jobs:
  rootless-model-link:
    if: >-
      github.event.repository.private == false &&
      github.head_ref == 'feat/factory-p0-authenticated-tool-api-probe-20261124' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPENHANDS_BINARY_SHA: 5ad5fa2bb86256b510df3bfbbd9653fbc60a243ea744a579d3ca4c6fd9e91cf3
      OPENHANDS_BASE: docker.io/library/ubuntu@sha256:9a04f13b3f80ef056361e30868593b1cfd2279fe19e4081cb93a90bf56819d6a
      LLAMA_SHA: da524c71f9dd09913df29264bb7229b99a2de82d8a26e6902e6921d413560d6d
      MODEL_SHA: 1d9614638d18024d0fbb36575a15f1302a3adf044df10345688ec4f6e1c4ff32
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout only trusted first-party audit code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 3.12 admission tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run local model-link evidence RED GREEN negative cases
        run: python -m unittest discover -s tests -p 'test_factory_rootless_tool_api.py' -v
      - name: Download existing signed repaired OpenHands source product (no rebuild)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: 45431783950
          name: openhands-source-product
          path: product

      - name: Reverify signed agent-server binary and independently archived scans
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          audit=docs/evidence/openhands-077f3fad
          echo "a86bac8c435a835697d8cfe3cee1f8c38ab4a99591b5af1fba6698686bfb7fd8  $audit/fixed-source-provenance.zip" | sha256sum -c -
          echo "684eba3009dc8885f9a3199220996083b32b139cab7d0a13fb63f6e2ac034760  $audit/fixed-source-audit.zip" | sha256sum -c -
          unzip -p "$audit/fixed-source-provenance.zip" bundle.jsonl > "$RUNNER_TEMP/source-bundle.jsonl"
          gh attestation verify product/openhands-agent-server \
            --bundle "$RUNNER_TEMP/source-bundle.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/openhands-source-build.yml" \
            --source-digest d2c1cd0c41695205f868ff89faa318a80bb754de \
            --deny-self-hosted-runners >/dev/null
          echo "$OPENHANDS_BINARY_SHA  product/openhands-agent-server" | sha256sum -c -
          for name in image-scan.json environment-scan.json; do
            unzip -p "$audit/fixed-source-audit.zip" "$name" | \
              jq -e '(.Results|length>0) and ([.Results[] | .Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length==0)' >/dev/null
          done
          echo 'PASS: signed verified OpenHands source agent-server binary; archived scan HIGH/CRITICAL gate.'
      - name: Verify actual rootless Podman cgroups before any sandbox execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          podman info --format json | jq -e '
            .host.security.rootless == true and
            .host.cgroupVersion == "v2" and
            (.host.cgroupControllers | contains(["cpu","memory","pids"]))
          ' >/dev/null
          echo 'PASS: operator rootless Podman host with CPU, memory and PID cgroup v2 controllers.'

      - name: Download only previously SHA-verified Qwen and llama.cpp inputs
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/qwen-rootless-build"
          mkdir -p "$stage"
          cd "$stage"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 150 \
            -o llama-b12600-bin-ubuntu-x64.tar.gz \
            https://github.com/ggml-org/llama.cpp/releases/download/b12600/llama-b12600-bin-ubuntu-x64.tar.gz
          echo "$LLAMA_SHA  llama-b12600-bin-ubuntu-x64.tar.gz" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 20 --max-time 270 \
            -o qwen-model.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/ebb2015119c907b064c512bf053e945850b5875f/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf?download=true"
          echo "$MODEL_SHA  qwen-model.gguf" | sha256sum -c -
          tar -xf llama-b12600-bin-ubuntu-x64.tar.gz
          test -x llama-b12600/llama-server
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 70 \
            -o libgomp1.deb \
            "https://security.ubuntu.com/ubuntu/pool/main/g/gcc-12/libgomp1_12.3.0-1ubuntu1~22.04.3_amd64.deb"
          echo "870c27299185a5dd4accad3b15bf82a7409fd7073cccaa8025875307da4d0ce2  libgomp1.deb" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 70 \
            -o libcurl4.deb \
            "https://security.ubuntu.com/ubuntu/pool/main/c/curl/libcurl4_7.81.0-1ubuntu1.30_amd64.deb"
          echo "2fc35b8056aebaa6cfe9a5672a8e06339c3e690657fbebc6c5d6b50d9f9626fb  libcurl4.deb" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 12 --max-time 70 \
            -o libstdcxx6.deb \
            "https://security.ubuntu.com/ubuntu/pool/main/g/gcc-12/libstdc++6_12.3.0-1ubuntu1~22.04.3_amd64.deb"
          echo "29ef3d289b272704b75141906c8f683db0f2bdb0942061366691333bfb289bdc  libstdcxx6.deb" | sha256sum -c -
          mkdir runtime-libs
          for pkg in libgomp1.deb libcurl4.deb libstdcxx6.deb; do
            dpkg-deb -x "$pkg" runtime-libs
          done
          echo 'PASS: exact Qwen model, llama.cpp and Ubuntu runtime libraries before image build.'

      - name: Run source-built OpenHands server and actual Qwen in one private Rootless network
        shell: bash
        run: |
          set -euo pipefail
          net="coden-factory-rootless-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          agent="coden-rootless-openhands-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          model="coden-rootless-qwen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          model_image="localhost/coden-rootless-qwen:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          agent_image="localhost/coden-rootless-openhands:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUNNER_TEMP/openhands-model-proof"
          cd "$RUNNER_TEMP/openhands-model-proof"
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "BLOCKED: sanitized rootless runtime diagnostics follow"
              podman inspect "$agent" "$model" 2>/dev/null | jq -c '[.[]|{name:.Name,state:.State.Status,exit:.State.ExitCode}]' || true
              podman logs --tail 15 "$agent" 2>&1 | sed -E 's/(token|password|key)=[^ ]+/redacted/Ig' || true
            fi
            podman rm -f --ignore "$agent" "$model" >/dev/null 2>&1 || true
            podman volume rm -f "coden-tmp-${GITHUB_RUN_ID}" "coden-work-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
            podman network rm "$net" >/dev/null 2>&1 || true
            podman image rm -f "$model_image" "$agent_image" >/dev/null 2>&1 || true
            echo "teardown_attempted" > cleanup-status.txt
          }
          trap cleanup EXIT

          # Build only from previously signed and exact hash-verified artifacts.
          mkdir -p agent-context
          install -m 0555 "$GITHUB_WORKSPACE/product/openhands-agent-server" agent-context/openhands-agent-server
          printf 'FROM %s\nCOPY openhands-agent-server /usr/local/bin/openhands-agent-server\nUSER 65534:65534\nENTRYPOINT ["/usr/local/bin/openhands-agent-server"]\nCMD []\n' "$OPENHANDS_BASE" > agent-context/Dockerfile
          podman pull --platform linux/amd64 "$OPENHANDS_BASE"
          podman build --network none --pull=never -t "$agent_image" agent-context
          podman pull --platform linux/amd64 docker.io/library/ubuntu@sha256:f64b2ffc2f10ab8f8505aa56b2664bd846cbb9df87c7e2532e30f7667021c0e6
          podman build --network none --pull=never \
            -f "$GITHUB_WORKSPACE/.github/docker/Factory-Qwen-CPU.Dockerfile" \
            -t "$model_image" "$RUNNER_TEMP/qwen-rootless-build"

          podman network create --internal --driver bridge "$net"
          podman network inspect "$net" | jq -e '.[0].internal == true and .[0].driver == "bridge"' >/dev/null

          podman volume create --opt type=tmpfs --opt device=tmpfs \
            --opt o=rw,exec,nosuid,nodev,size=768m,nr_inodes=32768,mode=1777 \
            "coden-tmp-${GITHUB_RUN_ID}"
          podman volume create --opt type=tmpfs --opt device=tmpfs \
            --opt o=rw,noexec,nosuid,nodev,size=32m,nr_inodes=2048,uid=65534,gid=65534,mode=0700 \
            "coden-work-${GITHUB_RUN_ID}"

          podman create --name "$model" --network "$net" --network-alias ollama \
            --http-proxy=false --read-only --read-only-tmpfs=false \
            --cap-drop=all --security-opt=no-new-privileges --user 65534:65534 \
            --cpus=2 --memory=1536m --memory-swap=1536m --pids-limit=64 \
            --cgroupns=private --pid=private --ipc=private --timeout=120 \
            --ulimit core=0:0 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777 \
            "$model_image" --model /opt/model.gguf --host 0.0.0.0 --port 11434 \
            --ctx-size 512 --threads 2 --n-gpu-layers 0 --no-warmup
          session_key="$(openssl rand -hex 24)"
          encryption_key="$(openssl rand -hex 32)"
          test "${#session_key}" -eq 48
          test "${#encryption_key}" -eq 64
          echo "::add-mask::$session_key"
          echo "::add-mask::$encryption_key"
          podman create --name "$agent" --network "$net" --network-alias openhands \
            --http-proxy=false --read-only --read-only-tmpfs=false \
            --cap-drop=all --security-opt=no-new-privileges --user 65534:65534 \
            --cpus=1 --memory=1536m --memory-swap=1536m --pids-limit=96 \
            --cgroupns=private --pid=private --ipc=private --timeout=120 \
            --ulimit core=0:0 \
            --volume "coden-tmp-${GITHUB_RUN_ID}:/tmp:rw,nocopy" \
            --volume "coden-work-${GITHUB_RUN_ID}:/workspace:rw,nocopy" \
            --workdir /workspace --env OH_SESSION_API_KEYS_0="$session_key" --env OH_SECRET_KEY="$encryption_key" \
            --env HOME=/workspace \
            --env XDG_CACHE_HOME=/workspace/cache --env OPENHANDS_SUPPRESS_BANNER=1 \
            "$agent_image" --host 0.0.0.0 --port 8002

          podman inspect "$agent" "$model" | jq -e 'length==2 and all(.[]; .HostConfig.Privileged==false and .HostConfig.ReadonlyRootfs==true and ((.HostConfig.PortBindings // {})|length==0) and .HostConfig.NetworkMode!="host")' >/dev/null
          podman start "$model"
          podman start "$agent"

          # The real agent-server health is verified INSIDE its container; no
          # port is exposed to the runner or the public Internet.
          health=false
          for _ in $(seq 1 45); do
            if [[ "$(podman inspect -f '{{.State.Running}}' "$agent")" != true ]]; then break; fi
            if podman exec "$agent" bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8002; printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -rt 3 line <&3; [[ "$line" == *" 200 "* ]]' 2>/dev/null; then
              health=true
              break
            fi
            sleep 1
          done
          test "$health" = true
          echo 'PASS: source-built OpenHands server /health HTTP 200 from its actual rootless container.'

          # Model is a REAL pinned Qwen2.5-Coder GGUF, not a mock HTTP endpoint.
          ready=false
          for _ in $(seq 1 35); do
            if [[ "$(podman inspect -f '{{.State.Running}}' "$model")" != true ]]; then break; fi
            if podman exec "$agent" bash -ec 'exec 3<>/dev/tcp/ollama/11434; printf "GET /health HTTP/1.0\r\nHost: ollama\r\n\r\n" >&3; read -rt 3 line <&3; [[ "$line" == *" 200 "* ]]' 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          echo 'PASS: actual OpenHands container reached real local Qwen llama-server /health.'

          # Egress must fail from the REAL OpenHands process network namespace.
          if timeout 5 podman exec "$agent" bash -ec 'exec 3<>/dev/tcp/1.1.1.1/80' >/dev/null 2>&1; then
            echo 'BLOCKED: public IP reachable from OpenHands' >&2; exit 1
          fi
          if timeout 5 podman exec "$agent" bash -ec 'exec 3<>/dev/tcp/example.com/80' >/dev/null 2>&1; then
            echo 'BLOCKED: public domain reachable from OpenHands' >&2; exit 1
          fi
          echo 'PASS: tested public IP and domain TCP egress denied from real OpenHands container.'

          # Request one real Qwen inference *from inside the running OpenHands*
          # server image; this is a network/inference probe, NOT SDK tool use.
          cat > query.sh <<'QUERY'
          set -euo pipefail
          body='{"prompt":"CODEN approved v1 synthetic private model link says: Hello","n_predict":12,"temperature":0,"seed":7}'
          exec 3<>/dev/tcp/ollama/11434
          printf 'POST /completion HTTP/1.0\r\nHost: ollama\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' "${#body}" "$body" >&3
          IFS= read -r status <&3
          [[ "$status" == *" 200 "* ]] || exit 1
          while IFS= read -r header <&3; do
            [[ "$header" == $'\r' || -z "$header" ]] && break
          done
          cat <&3 > /workspace/model-response.json
          test -s /workspace/model-response.json
          QUERY
          timeout 45 podman exec -i "$agent" bash -s < query.sh
          podman exec "$agent" cat /workspace/model-response.json > model-response.json

          # Verify the actual response structure but keep the generated words
          # off GitHub artifact and job logs. Only SHA and count are retained.
          python - <<'PY'
          import json
          from pathlib import Path
          from ai_factory.factory_real_qwen_server_admission import audit_completion
          body = json.loads(Path("model-response.json").read_text(encoding="utf-8"))
          verdict = audit_completion(body)
          Path("model-verdict.json").write_text(json.dumps(verdict), encoding="utf-8")
          print("PASS: actual Qwen completion from inside rootless OpenHands server image;",
                verdict["tokens_predicted"], "generated tokens.")
          PY

          # This real client runs inside the same internal bridge; the server
          # is not published to the runner, and its ephemeral credentials are
          # never written to files or exported as CI artifacts.
          # Authenticate from inside the existing agent container. Never
          # inject a session key into the Qwen container.
          cat > auth-check.sh <<'AUTH'
          set -euo pipefail
          request_status() {
            local key="$1"
            exec 3<>/dev/tcp/127.0.0.1/8002
            if [[ -n "$key" ]]; then
              printf 'GET /api/conversations/count HTTP/1.0\r\nHost: openhands\r\nX-Session-API-Key: %s\r\nConnection: close\r\n\r\n' "$key" >&3
            else
              printf 'GET /api/conversations/count HTTP/1.0\r\nHost: openhands\r\nConnection: close\r\n\r\n' >&3
            fi
            local status
            IFS= read -r status <&3
            exec 3<&- 3>&-
            printf '%s' "$status"
          }
          unauth=$(request_status "")
          [[ "$unauth" == *" 401 "* ]] || { echo 'BLOCKED: no-key request not 401'; exit 1; }
          wrong=$(request_status "intentionally-invalid-session")
          [[ "$wrong" == *" 401 "* ]] || { echo 'BLOCKED: wrong-key request not 401'; exit 1; }
          valid=$(request_status "$OH_SESSION_API_KEYS_0")
          [[ "$valid" == *" 200 "* ]] || { echo 'BLOCKED: valid-key request not 200'; exit 1; }
          echo 'PASS: real OpenHands API returned 401/401/200 for no/wrong/correct synthetic key.'
          AUTH
          podman exec -i "$agent" bash -eu -s < auth-check.sh

          # Exactly one operator-authored synthetic tool command, NOT from Qwen.
          # Bash API credentials remain in OpenHands, never Qwen.
          cat > tool-api-check.sh <<'TOOL_API'
          set -euo pipefail
          body='{"command":"printf CODEN_FACTORY_TOOL_EXECUTION_OK","cwd":"/workspace","timeout":8}'
          body_len=$(printf '%s' "$body" | wc -c)
          post_command() {
            local key="$1"
            exec 3<>/dev/tcp/127.0.0.1/8002
            if [[ -n "$key" ]]; then
              printf 'POST /api/bash/execute_bash_command HTTP/1.0\r\nHost: openhands\r\nContent-Type: application/json\r\nX-Session-API-Key: %s\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' "$key" "$body_len" "$body" >&3
            else
              printf 'POST /api/bash/execute_bash_command HTTP/1.0\r\nHost: openhands\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' "$body_len" "$body" >&3
            fi
            local status
            IFS= read -r status <&3
            if [[ "$key" == "$OH_SESSION_API_KEYS_0" ]]; then
              [[ "$status" == *" 200 "* ]] || { echo 'BLOCKED: authenticated Bash tool API failed'; exit 1; }
              while IFS= read -r header <&3; do
                [[ "$header" == "$(printf '\r')" || -z "$header" ]] && break
              done
              cat <&3 > /workspace/operator-tool-response.json
              test -s /workspace/operator-tool-response.json
            fi
            exec 3<&- 3>&-
            printf '%s' "$status"
          }
          no_key=$(post_command "")
          [[ "$no_key" == *" 401 "* ]] || { echo 'BLOCKED: tool API without auth not 401'; exit 1; }
          wrong_key=$(post_command "intentionally-invalid-session")
          [[ "$wrong_key" == *" 401 "* ]] || { echo 'BLOCKED: tool API incorrect auth not 401'; exit 1; }
          correct_key=$(post_command "$OH_SESSION_API_KEYS_0")
          [[ "$correct_key" == *" 200 "* ]] || exit 1
          echo 'PASS: upstream OpenHands Bash tool API 401/401/200 with one operator synthetic command.'
          TOOL_API
          timeout 30 podman exec -i "$agent" bash -eu -s < tool-api-check.sh
          podman exec "$agent" cat /workspace/operator-tool-response.json > tool-response.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          response=json.loads(Path("tool-response.json").read_text(encoding="utf-8"))
          assert type(response) is dict
          assert type(response.get("exit_code")) is int and response["exit_code"] == 0
          assert type(response.get("stdout")) is str
          assert response["stdout"].strip() == "CODEN_FACTORY_TOOL_EXECUTION_OK"
          assert response.get("stderr") in (None, "")
          Path("tool-verdict.json").write_text(json.dumps({
              "actual_api_bash_command_ran":True,
              "real_tool_exit_zero":True,
              "exact_synthetic_stdout_verified":True,
              "stdout_sha256":hashlib.sha256(response["stdout"].encode("utf-8")).hexdigest(),
              "model_generated_this_command":False,
          }),encoding="utf-8")
          print("PASS: real authenticated OpenHands Bash API: exit zero and exact synthetic stdout.")
          PY

          cat > agent-process-proof.sh <<'AGENT_PROC_PROOF'
          set -euo pipefail
          test "$(id -u)" = 65534
          test "$(cat /sys/fs/cgroup/memory.max)" = 1610612736
          test "$(cat /sys/fs/cgroup/pids.max)" = 96
          read -r quota period < /sys/fs/cgroup/cpu.max
          test "$quota" = "$period"
          test "$(df -Pi /tmp | awk 'NR==2 {print $2}')" = 32768
          test "$(df -Pi /workspace | awk 'NR==2 {print $2}')" = 2048
          test "$(ls /sys/class/net | grep -vc '^lo$')" -ge 1
          test ! -S /var/run/docker.sock
          count=0
          for exe in /proc/[0-9]*/exe; do
            [[ "$(readlink "$exe" || true)" == /usr/local/bin/openhands-agent-server ]] || continue
            proc=$(dirname "$exe")
            cmp /proc/self/cgroup "$proc/cgroup"
            grep -Eq '^CapEff:[[:space:]]+0+$' "$proc/status"
            grep -Eq '^NoNewPrivs:[[:space:]]+1$' "$proc/status"
            keys=$(tr '\0' '\n' < "$proc/environ" | cut -d= -f1)
            printf '%s\n' "$keys" | grep -Fxq OH_SESSION_API_KEYS_0
            printf '%s\n' "$keys" | grep -Fxq OH_SECRET_KEY
            unexpected=$(printf '%s\n' "$keys" | grep -Ev '^(OH_SESSION_API_KEYS_0|OH_SECRET_KEY)$' || true)
            if grep -Eiq '(TOKEN|PASSWORD|API.KEY|GITHUB_|DOCKER_HOST|SECRET)' <<< "$unexpected"; then
              echo 'BLOCKED: extra secret-looking env name in actual OpenHands child' >&2
              exit 1
            fi
            count=$((count+1))
          done
          test "$count" -ge 2
          echo 'PASS: actual OpenHands child quotas, isolation, session-key allowlist.'
          AGENT_PROC_PROOF
          podman exec -i "$agent" bash -eu -s < agent-process-proof.sh

          cat > model-process-proof.sh <<'MODEL_PROC_PROOF'
          set -eu
          test "$(id -u)" = 65534
          test "$(cat /sys/fs/cgroup/memory.max)" = 1610612736
          test "$(cat /sys/fs/cgroup/pids.max)" = 64
          set -- $(cat /sys/fs/cgroup/cpu.max)
          test "$1" -eq $((2*$2))
          grep -Eq '^CapEff:[[:space:]]+0+$' /proc/self/status
          grep -Eq '^NoNewPrivs:[[:space:]]+1$' /proc/self/status
          test ! -S /var/run/docker.sock
          test "$(df -Pk /tmp | awk 'NR==2 {print $2}')" = 32768
          keys=$(env | cut -d= -f1)
          if printf '%s\n' "$keys" | grep -Eiq '(TOKEN|PASSWORD|API.KEY|GITHUB_|DOCKER_HOST|SECRET)'; then
            echo 'BLOCKED: secret-like env key in Qwen container' >&2
            exit 1
          fi
          echo 'PASS: real Qwen resource caps, no extra privileges, no session key.'
          MODEL_PROC_PROOF
          podman exec -i "$model" /bin/sh -eu -s < model-process-proof.sh

          members=$(podman ps --filter "network=$net" --format '{{.ID}}' | wc -l)
          test "$members" -eq 2

          python - <<'PY'
          import json, os
          from pathlib import Path
          from ai_factory.factory_rootless_openhands_qwen_link import (
              BINARY_SHA, UPSTREAM, validate_receipt
          )
          from ai_factory.factory_real_qwen_server_admission import LLAMA_SHA, MODEL_SHA
          generated = json.loads(Path("model-verdict.json").read_text())
          proof = {
              "plan_version": "v1.0",
              "upstream_source_commit": UPSTREAM,
              "binary_sha256": BINARY_SHA,
              "model_sha256": MODEL_SHA,
              "llama_cpp_archive_sha256": LLAMA_SHA,
              "real_qwen_tokens_predicted": generated["tokens_predicted"],
              "real_qwen_response_sha256": generated["response_sha256"],
