          private,scratch,bp=Path(sys.argv[1]),Path(sys.argv[2]),int(sys.argv[3])
          assert os.getuid()!=0
          st=dict(x.split(":",1) for x in Path("/proc/self/status").read_text().splitlines() if ":" in x)
