          sudo chmod 0755 "$base"
          sudo install -d -m 0700 -o "$bu" -g "$bg" "$base/private"
          sudo install -d -m 0700 -o "$tu" -g "$tg" "$base/scratch"
          sudo mount -t tmpfs -o "size=960m,nosuid,nodev,noexec,mode=0700,uid=$tu,gid=$tg" tmpfs "$base/scratch"
          sudo install -d -m 0700 -o "$tu" -g "$tg" "$base/scratch/tmp"
