          assert os.readlink("/proc/self/ns/net")!=host
          assert kernel==["lo"] and proc_names==["lo"]
          assert not ipv4 and not any(line.split()[-1]!="lo" for line in routes6 if line.strip())
          if len(sys.argv)==2:
              print("OFFLINE_NAMESPACE_NONROOT_KERNEL_PROC_NO_EXTERNAL_ROUTES")
          else:
              print("ACTUAL_INSPECTION_NAMESPACE_VERIFIED",file=sys.stderr)
              sys.argv=sys.argv[2:]
              runpy.run_path(sys.argv[0],run_name="__main__")
          PYGUARD
          sudo unshare --net -- setpriv --reuid "$uid" --regid "$gid" --clear-groups --no-new-privs env -i PATH=/usr/bin:/bin python3 -I "$guard" "$host_ns" > "$ev/network-preflight.txt"
