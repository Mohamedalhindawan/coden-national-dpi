              except urllib.error.HTTPError as e:
                  if e.code not in (301,302,303,307,308): raise
                  redirect=e.headers.get("Location","")
                  u=urlsplit(redirect)
                  assert u.scheme=="https" and u.hostname=="pkg-containers.githubusercontent.com" and not u.username and not u.password and u.port in (None,443)
