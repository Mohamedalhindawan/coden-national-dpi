          assert (p/"memory.max").read_text().strip()=="2147483648"
          assert (p/"pids.max").read_text().strip()=="64"
          # Exercise actual shared tmpfs capacity, not sparse file length or
          # an application-level reservation. The only workload is trusted data.
          v=os.statvfs(scratch); block=v.f_frsize
