          import hashlib,json,os,re,sys,urllib.error,urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          store,ev=map(Path,sys.argv[1:])
          cap=512*1024**2
          image="sha256:9a36355fa2baacaae1c6dd5a1a80492bba89d1dec5a536af572ba5fb3e96e22f"
          config="sha256:132971a4abd0f0274f66045f4a6fd37d89b45c4a1029d3c17849a54a3dc3d9f1"
          base="https://ghcr.io/v2/openhands/agent-server/"
          report=dict(status="ACQUISITION_STARTED",manifest_digest=image,config_digest=config,
                      max_compressed_bytes=cap,verified_blobs=[],image_executed=False,
                      installed=False,build_authorized=False,execution_authorized=False,release_authorized=False)
          def save():
              (ev/"acquisition.json").write_text(json.dumps(report,indent=2)+"\n")
          save()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
