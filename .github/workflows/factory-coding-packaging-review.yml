          private=Path(sys.argv[1])
          assert os.getuid()!=0
          (private/"credential").write_bytes(b"synthetic-not-a-real-secret")
          os.chmod(private/"credential",0o600)
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM)
          s.bind(str(private/"socket")); os.chmod(private/"socket",0o600); s.listen(1)
          c=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM)
          c.connect(str(private/"socket")); a,_=s.accept()
