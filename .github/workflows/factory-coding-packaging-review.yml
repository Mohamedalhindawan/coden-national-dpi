              assert os.getuid()!=0
              report["store_capacity_bytes"]=v.f_frsize*v.f_blocks
              mount=(ev/"store-mount.txt").read_text().split()
              assert mount[0]=="tmpfs" and {"nosuid","nodev","noexec"}<=set(mount[1].split(","))
              blobs=store/"blobs"/"sha256"; blobs.mkdir(parents=True)
              token=json.loads(bounded("https://ghcr.io/token?service=ghcr.io&scope=repository%3Aopenhands%2Fagent-server%3Apull",{},65536))["token"]
              assert isinstance(token,str) and 0<len(token)<16384
              auth={"Authorization":"Bearer "+token,"Accept-Encoding":"identity"}
              raw=bounded(base+"manifests/"+image,dict(auth,Accept="application/vnd.oci.image.manifest.v1+json"),1048576)
              assert digest(raw)==image
