              str(scratch/"ready")],start_new_session=True,stdin=subprocess.DEVNULL,
              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          deadline=time.monotonic()+5
          while not (scratch/"ready").is_file() and time.monotonic()<deadline:time.sleep(.05)
