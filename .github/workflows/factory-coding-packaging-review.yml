  official-minimal-authorized-offline-inspection:
    # Single operator-authorized transition from Sprint11. No automatic repeat.
    if: github.event.repository.private == false && github.event.action == 'synchronize' && github.event.before == '59e2f0bf81502c8a0bc58740a5ce730c06fb2efe' && github.event.pull_request.number == 200 && github.head_ref == 'review/factory-v3-sprint05-candidate-20261125' && github.base_ref == 'feat/factory-acceleration-batch01-20261124' && github.event.pull_request.head.repo.full_name == github.repository && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Acquire exact public image blobs and inspect offline, never load or execute image
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 evidence
          ev="$PWD/evidence"
          store="$(mktemp -d "${RUNNER_TEMP}/coden-oci.XXXXXXXX")"
          guard="$(mktemp "${RUNNER_TEMP}/coden-offline-guard.XXXXXXXX.py")"
