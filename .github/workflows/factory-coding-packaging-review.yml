          assert os.getsid(0)!=os.getsid(child.pid)
          assert cg in Path(f"/proc/{child.pid}/cgroup").read_text()
          assert int(child.pid) in [int(x) for x in (p/"cgroup.procs").read_text().split()]
          print(json.dumps(dict(checks,tool_uid=os.getuid(),child_pid=child.pid,
              separate_session=True,cgroup=cg,cpu_max=cpu,agent_ran=False,
              real_qwen_connected=False,release_authorized=False),sort_keys=True),flush=True)
          time.sleep(45)
          PY
          )"
          sudo systemd-run --quiet --unit="$tool" -p "User=$tu" -p "Group=$tg" \
            -p "BindPaths=$base/scratch/tmp:/tmp $base/scratch/tmp:/var/tmp" \
            -p "ReadWritePaths=$base/scratch /tmp /var/tmp" "${common[@]}" \
            /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I -B -c "$tool_code" "$base/private" "$base/scratch" "$bp"
