name: CODEN P0 coding-only server packaging source contract
on:
  pull_request:
    paths: ['.github/workflows/factory-coding-packaging-review.yml']
permissions: {}
jobs:
  review:
    if: github.event.repository.private == false && github.head_ref == 'audit/factory-p0-coding-wheel-notices-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OpenHands/software-agent-sdk
          ref: 077f3fad6d31cd852be5c87176e0a93c3b446126
          persist-credentials: false
          path: upstream
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45459482500
          name: optional-tom-runtime-scope
          path: input
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Verify exact upstream and optional manifest inputs
        run: |
          set -euo pipefail
          mkdir -m 0700 evidence
          test "$(git -C upstream rev-parse HEAD)" = 077f3fad6d31cd852be5c87176e0a93c3b446126
          echo '03975e58f3606f67a9458eae3a28a4076d58296805ab20a537986f03fbe8cf50  input/optional-tom-manifest.patch' | sha256sum -c -
          echo '6bcb3f75c6a1803e3c47cad87c4881c5e250431b876d79e1deec2f82bd1a4301  input/optional-tom.lock' | sha256sum -c -
          git -C upstream apply --check ../input/optional-tom-manifest.patch
          git -C upstream apply ../input/optional-tom-manifest.patch
      - name: Static RED and GREEN source contract (no upstream code executed)
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          root=Path("upstream")
          server=root/"openhands-agent-server/openhands/agent_server"
          router=server/"tool_router.py"
          config=server/"config.py"
          spec=server/"agent-server.spec"
          laminar=root/"openhands-sdk/openhands/sdk/observability/laminar.py"
          original={router:"c79975f466b2f6fb841ca4b56a863c400f5234b5",config:"a5cddce61e99d6ebf32a1eaca9dc623b19e55151",spec:"9cb330d45e4ba8f49259b571167dfd567cc43430",laminar:"d167cc3b8065159d06ddf9763698a244d6de557f"}
          for p,sha in original.items():
              raw=p.read_bytes()
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sha
          forbidden=("openhands.tools.browser_use","openhands.tools.tom_consult","openhands.tools.utils.timeout","browser_use","browser_use_sdk","func_timeout","lmnr","lmnr_claude_code_proxy","tom_swe")
          def checks():
              rt=ast.parse(router.read_text())
              ct=ast.parse(config.read_text())
              st=ast.parse(spec.read_text())
              lt=ast.parse(laminar.read_text())
              calls={n.func.id:n for n in ast.walk(rt) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id in ("register_default_tools","register_builtins_agents","register_gemini_tools")}
              registration= len(calls)==3 and all(any(k.arg=="enable_browser" and isinstance(k.value,ast.Constant) and k.value.value is False for k in n.keywords) for n in calls.values())
              cls=next(n for n in ct.body if isinstance(n,ast.ClassDef) and n.name=="Config")
              f=next(n for n in cls.body if isinstance(n,ast.AnnAssign) and isinstance(n.target,ast.Name) and n.target.id=="enable_browser")
              default_off=any(k.arg=="default" and isinstance(k.value,ast.Constant) and k.value.value is False for k in f.value.keywords)
              validator=any(isinstance(n,ast.FunctionDef) and n.name=="reject_coding_browser" for n in cls.body)
              analysis=next(n.value for n in st.body if isinstance(n,ast.Assign) and isinstance(n.value,ast.Call) and isinstance(n.value.func,ast.Name) and n.value.func.id=="Analysis")
              ex=next(k.value for k in analysis.keywords if k.arg=="excludes")
              exclusion=all(any(isinstance(n,ast.Constant) and n.value==x for n in ex.elts) for x in forbidden)
              hidden=next(k.value for k in analysis.keywords if k.arg=="hiddenimports")
              tool_filter=any(isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=="collect_submodules" and n.args and isinstance(n.args[0],ast.Constant) and n.args[0].value=="openhands.tools" and any(k.arg=="filter" for k in n.keywords) for n in ast.walk(hidden))
              browser_data=not any(isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=="collect_data_files" and n.args and isinstance(n.args[0],ast.Constant) and n.args[0].value=="openhands.tools.browser_use" for n in ast.walk(st))
              telemetry=next(n for n in lt.body if isinstance(n,ast.FunctionDef) and n.name=="should_enable_observability")
              telemetry_off=any(isinstance(n,ast.Raise) for n in ast.walk(telemetry)) and isinstance(telemetry.body[-1],ast.Return) and isinstance(telemetry.body[-1].value,ast.Constant) and telemetry.body[-1].value.value is False
              return dict(registration_off=registration,config_default_off=default_off,config_reject_browser=validator,explicit_excludes=exclusion,tool_collection_filter=tool_filter,browser_data_removed=browser_data,laminar_fail_closed=telemetry_off)
          red=checks()
          assert not all(red.values()),red
          print("RED:",red)
          def edit(p,old,new):
              raw=p.read_text()
              assert raw.count(old)==1,(str(p),old)
              p.write_text(raw.replace(old,new,1))
          for f in ("register_default_tools","register_builtins_agents","register_gemini_tools"):
              edit(router,f+"(enable_browser=True)",f+"(enable_browser=False)")
          edit(config,"enable_browser: bool = Field(\n        default=True,","enable_browser: bool = Field(\n        default=False,")
          edit(config,'    @field_validator("session_api_keys")',
              '    @field_validator("enable_browser")\n    @classmethod\n    def reject_coding_browser(cls, value: bool) -> bool:\n        if value:\n            raise ValueError("Browser is unavailable in the CODEN coding profile")\n        return value\n\n    @field_validator("session_api_keys")')
          edit(spec,'        *collect_data_files("openhands.tools.browser_use", includes=["js/*.js"]),\n','')
          edit(spec,'        *collect_submodules("openhands.tools"),',
               '        *collect_submodules("openhands.tools", filter=lambda name: not any(name == prefix or name.startswith(prefix + ".") for prefix in '+repr(forbidden[:3])+')),')
          edit(spec,"    excludes=[\n","    excludes=[\n"+''.join('        '+repr(n)+',\n' for n in forbidden))
          raw=laminar.read_text()
          start=raw.index("def should_enable_observability() -> bool:")
          end=raw.index("\ndef _is_otel_backend_laminar()",start)
          body="def should_enable_observability() -> bool:\n    # Laminar unavailable; local operator audit remains independent.\n    if any(get_env(key) for key in _OBSERVABILITY_ENV_KEYS) or 'lmnr' in sys.modules:\n        raise RuntimeError('Laminar unavailable in CODEN coding profile')\n    return False\n\n"
          laminar.write_text(raw[:start]+body+raw[end:])
          green=checks()
          assert all(green.values()),green
          print("GREEN:",green)
          for p in original:
              compile(p.read_text(),str(p),"exec")  # compile only, no imports or execution
          Path("evidence/packaging-contract.json").write_text(json.dumps({"red":red,"green":green,"status":"static_source_contract_pass","runtime_imports_verified":False,"built":False,"installed":False,"license_approved":False,"release_authorized":False},indent=2))
          PY
          git -C upstream diff -- '*pyproject.toml' '*.py' '*.spec' > evidence/coding-profile-source.patch
          sha256sum evidence/coding-profile-source.patch > evidence/patch.sha256
          git -C upstream diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coding-packaging-source-contract
          path: evidence/
          if-no-files-found: error
          retention-days: 7

  source-capacity-review:
    if: github.event.repository.private == false && github.head_ref == 'fix/factory-staging-inventory-consistency-20261125' && github.base_ref == 'feat/factory-acceleration-batch01-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OpenHands/software-agent-sdk
          ref: 077f3fad6d31cd852be5c87176e0a93c3b446126
          persist-credentials: false
          path: upstream
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45474396046
          name: coding-packaging-source-contract
          path: inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45528990156
          name: r2-staging-capacity-review
          path: capacity
      - name: Measure patched tracked source without executing it
        run: |
          set -euo pipefail
          mkdir -m 0700 evidence
          test "$(git -C upstream rev-parse HEAD)" = 077f3fad6d31cd852be5c87176e0a93c3b446126
          printf '%s\n' '0609700a143b3fc8b0439f7ff2c74b75aa41c220fa9ba4294db35bac54b8f70f  inputs/coding-profile-source.patch' '4efcc832216289d4cc845f52582f49954734499e712af0e8bac716a324d5e086  capacity/staging-capacity.json' | sha256sum -c -
          git -C upstream apply --check ../inputs/coding-profile-source.patch
          git -C upstream apply ../inputs/coding-profile-source.patch
          git -C upstream diff --check
          git -C upstream ls-files --stage -z > evidence/tracked-index.nul
          python3 - <<'PY'
          import hashlib, json, stat
          from pathlib import Path
          root=Path("upstream")
          groups={n:{"files":0,"bytes":0,"page_rounded_bytes":0,"symlinks":0} for n in
                  ("openhands-sdk","openhands-tools","openhands-agent-server","openhands-workspace","other")}
          records=[]
          for entry in Path("evidence/tracked-index.nul").read_bytes().split(b"\0"):
              if not entry: continue
              meta, raw=entry.split(b"\t",1)
              mode, oid, stage=meta.decode().split()
              name=raw.decode("utf-8")
              relative=Path(name)
              if relative.is_absolute() or ".." in relative.parts or stage!="0":
                  raise ValueError("unexpected tracked entry")
              p=root/relative
              for parent in relative.parents:
                  if (root/parent).is_symlink(): raise ValueError("linked source parent")
              info=p.lstat()
              key=relative.parts[0] if relative.parts[0] in groups else "other"
              g=groups[key]
              if mode=="120000" and stat.S_ISLNK(info.st_mode):
                  g["symlinks"]+=1
                  continue
              if mode not in ("100644","100755") or not stat.S_ISREG(info.st_mode):
                  raise ValueError("unreviewed source member type")
              size=info.st_size
              if size>128*1024**2: raise ValueError("source member too large")
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              allocated=((size+4095)//4096)*4096
              g["files"]+=1; g["bytes"]+=size; g["page_rounded_bytes"]+=allocated
              records.append({"path":name,"bytes":size,"sha256":digest,"page_rounded_bytes":allocated})
          assert all(groups[n]["files"] for n in groups if n!="other")
          assert (root/"LICENSE").is_file()
          receipt=json.loads(Path("capacity/staging-capacity.json").read_text())
          assert receipt["input_count"]==132 and receipt["build_authorized"] is False
          source=sum(g["page_rounded_bytes"] for g in groups.values())
          editable=sum(g["page_rounded_bytes"] for n,g in groups.items() if n!="other")
          peak=receipt["peak_bytes"]
          cap=960*1024**2
          # Stress scenarios only: no claim of installer or PyInstaller allocation.
          scenarios=[]
          for temporary,output,duplication in [(32,64,0),(32,64,64),(64,128,128),(32,64,288)]:
              total=peak+source+(temporary+output+duplication)*1024**2
              scenarios.append(dict(temporary_mib=temporary,output_mib=output,duplication_mib=duplication,modeled_bytes=total,fits=total<=cap,headroom_bytes=cap-total))
          report=dict(groups=groups,tracked_regular_file_count=len(records),tracked_page_rounded_bytes=source,
                      editable_page_rounded_bytes=editable,source_plus_staging_model_bytes=peak+source,
                      scenarios=scenarios,source_license_sha256=hashlib.sha256((root/"LICENSE").read_bytes()).hexdigest(),
                      metadata_overhead_measured=False,symlink_allocation_measured=False,actual_installer_peak_measured=False,
                      actual_build_output_measured=False,build_authorized=False,release_authorized=False)
          Path("evidence/source-capacity.json").write_text(json.dumps(report,indent=2))
          Path("evidence/source-files.json").write_text(json.dumps(records,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r2-patched-source-capacity
          path: evidence/
          if-no-files-found: error
          retention-days: 7

  official-runtime-metadata-review:
    if: github.event.repository.private == false && github.head_ref == 'review/factory-v3-sprint05-candidate-20261125' && github.base_ref == 'feat/factory-acceleration-batch01-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions: {}
    steps:
      - name: Check exact upstream image tag availability and manifest identity only
        run: |
          set -euo pipefail
          mkdir -m 0700 evidence
          python3 - <<'PY'
          import hashlib, json, re, urllib.error, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          def get(url,headers=None):
              with opener.open(urllib.request.Request(url,headers=headers or {}),timeout=15) as res:
                  data=res.read(2*1024**2+1)
                  if len(data)>2*1024**2: raise ValueError("metadata too large")
                  return data,res.headers
          root="https://ghcr.io/v2/openhands/agent-server/"
          raw,_=get("https://ghcr.io/token?service=ghcr.io&scope=repository%3Aopenhands%2Fagent-server%3Apull")
          token=json.loads(raw)["token"]
          assert isinstance(token,str) and 0<len(token)<16384
          headers={"Authorization":"Bearer "+token,"Accept":", ".join((
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.docker.distribution.manifest.v2+json"))}
          tags=["077f3fa-python-amd64","077f3fa-python-minimal-amd64",
                "077f3fa-python-amd64-source-minimal","077f3fa-python-minimal-amd64-source-minimal"]
          results=[]
          def manifest(ref):
              data,h=get(root+"manifests/"+ref,headers)
              digest="sha256:"+hashlib.sha256(data).hexdigest()
              assert h.get("Docker-Content-Digest")==digest
              if ref.startswith("sha256:"): assert ref==digest
              Path("evidence",digest[7:]+".json").write_bytes(data)
              return json.loads(data),digest
          for tag in tags:
              try:
                  obj,digest=manifest(tag)
                  image,selected=obj,digest
                  if "manifests" in obj:
                      m=[m for m in obj["manifests"] if m.get("platform",{}).get("os")=="linux" and m.get("platform",{}).get("architecture")=="amd64"]
                      assert len(m)==1
                      image,selected=manifest(m[0]["digest"])
                  layers=image["layers"]
                  assert 0<len(layers)<256 and all(type(l["size"]) is int and l["size"]>=0 for l in layers)
                  config=image["config"]["digest"]
                  assert re.fullmatch(r"sha256:[a-f0-9]{64}",config)
                  results.append(dict(tag=tag,status="MANIFEST_FOUND",manifest_digest=digest,amd64_manifest_digest=selected,
                                      config_digest=config,compressed_layer_bytes=sum(l["size"] for l in layers),
                                      layers=len(layers),source_provenance_verified=False,license_approved=False))
              except urllib.error.HTTPError as exc:
                  results.append(dict(tag=tag,status="REGISTRY_HTTP_"+str(exc.code)))
          report=dict(results=results,upstream_commit="077f3fad6d31cd852be5c87176e0a93c3b446126",
                      manifests_only=True,image_layers_downloaded=False,source_provenance_verified=False,
                      installed_dependency_inventory_verified=False,rootless_runtime_verified=False,
                      build_authorized=False,release_authorized=False)
          Path("evidence/review.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r2-official-runtime-metadata-review
          path: evidence/
          if-no-files-found: error
          retention-days: 7

  official-minimal-attestation-review:
    if: github.event.repository.private == false && github.head_ref == 'review/factory-v3-sprint05-candidate-20261125' && github.base_ref == 'feat/factory-acceleration-batch01-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions: {}
    steps:
      - name: Read exact minimal image attestation metadata only
        run: |
          set -euo pipefail
          mkdir -m 0700 evidence
          python3 - <<'PY'
          import hashlib,json,re,urllib.error,urllib.request
          from urllib.parse import urlsplit
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          root="https://ghcr.io/v2/openhands/agent-server/"
          image="sha256:9a36355fa2baacaae1c6dd5a1a80492bba89d1dec5a536af572ba5fb3e96e22f"
          att="sha256:bc6e00fe25f5ede26b457ce7bd1db4a37b44229e51c304d6b6761d868b72c14a"
          limit=32*1024**2
          def fetch(url, headers=None, cap=limit):
              with opener.open(urllib.request.Request(url,headers=headers or {}),timeout=15) as res:
                  raw=res.read(cap+1)
                  if len(raw)>cap: raise ValueError("metadata exceeds limit")
                  return raw
          token=json.loads(fetch("https://ghcr.io/token?service=ghcr.io&scope=repository%3Aopenhands%2Fagent-server%3Apull",cap=65536))["token"]
          assert isinstance(token,str) and 0<len(token)<16384
          auth={"Authorization":"Bearer "+token}
          def checked(raw,digest):
              assert "sha256:"+hashlib.sha256(raw).hexdigest()==digest
              return json.loads(raw)
          raw=fetch(root+"manifests/"+att,dict(auth,Accept="application/vnd.oci.image.manifest.v1+json"),cap=1048576)
          obj=checked(raw,att)
          Path("evidence/attestation-manifest.json").write_bytes(raw)
          layers=obj["layers"]
          assert 0<len(layers)<=8
          results=[]
          for layer in layers:
              digest=layer["digest"]
              assert re.fullmatch(r"sha256:[0-9a-f]{64}",digest)
              size=layer["size"]
              assert type(size) is int and 0<size<=limit
              assert layer["mediaType"]=="application/vnd.in-toto+json"
              result=dict(digest=digest,size=size,declared_predicate=layer.get("annotations",{}).get("in-toto.io/predicate-type"))
              try:
                  try: payload=fetch(root+"blobs/"+digest,auth,cap=size)
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (301,302,303,307,308): raise
                      target=exc.headers.get("Location","")
                      u=urlsplit(target)
                      # Never forward the registry token to a redirect host.
                      if u.scheme!="https" or u.hostname!="pkg-containers.githubusercontent.com" or u.username or u.password or u.port not in (None,443):
                          result["status"]="UNAPPROVED_REDIRECT_HOST"
                          results.append(result)
                          continue
                      payload=fetch(target,cap=size)
                  assert len(payload)==size
                  statement=checked(payload,digest)
                  assert isinstance(statement.get("predicate"),dict)
                  subject=any(x.get("digest",{}).get("sha256")==image[7:] for x in statement.get("subject",[]))
                  assert subject
                  Path("evidence",digest[7:]+".json").write_bytes(payload)
                  pred=statement["predicate"]; kind=statement.get("predicateType")
                  result.update(status="DIGEST_AND_SUBJECT_MATCH",predicate_type=kind,subject_matches=True)
                  packages=pred.get("packages",[])
                  if isinstance(packages,list):
                      hits=[]
                      for item in packages:
                          name=str(item.get("name","")).lower().replace("_","-")
                          if name in ("browser-use-sdk","lmnr-claude-code-proxy","browser-use","lmnr"):
                              hits.append(dict(name=name,version=item.get("versionInfo"),license=item.get("licenseConcluded")))
                      result.update(spdx_package_records=len(packages),relevant_packages=hits)
              except urllib.error.HTTPError as exc:
                  result["status"]="HTTP_"+str(exc.code)
              results.append(result)
          report=dict(image_manifest_digest=image,attestation_manifest_digest=att,results=results,
                      signature_identity_verified=False,compiled_inventory_verified=False,legal_approved=False,
                      image_layers_downloaded=False,build_authorized=False,release_authorized=False)
          Path("evidence/review.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r2-official-minimal-attestation-review
          path: evidence/
          if-no-files-found: error
          retention-days: 7

  official-minimal-config-review:
    if: github.event.repository.private == false && github.head_ref == 'review/factory-v3-sprint05-candidate-20261125' && github.base_ref == 'feat/factory-acceleration-batch01-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions: {}
    steps:
      - name: Review only immutable OCI image config
        run: |
          set -euo pipefail
          mkdir -m 0700 evidence
          python3 - <<'PY'
          import hashlib,json,re,urllib.error,urllib.request
          from urllib.parse import urlsplit
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          root="https://ghcr.io/v2/openhands/agent-server/"
          image="sha256:9a36355fa2baacaae1c6dd5a1a80492bba89d1dec5a536af572ba5fb3e96e22f"
          config="sha256:132971a4abd0f0274f66045f4a6fd37d89b45c4a1029d3c17849a54a3dc3d9f1"
          def fetch(url,headers=None,cap=1048576):
              with opener.open(urllib.request.Request(url,headers=headers or {}),timeout=15) as res:
                  data=res.read(cap+1)
                  if len(data)>cap: raise ValueError("metadata too large")
                  return data
          def checked(raw,digest):
              assert "sha256:"+hashlib.sha256(raw).hexdigest()==digest
              return json.loads(raw)
