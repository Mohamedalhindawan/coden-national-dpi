          assert capacity==960*1024*1024 and block>0
          assert all(os.stat(q).st_dev==os.stat(scratch).st_dev for q in
                     (scratch/"tmp",Path("/tmp"),Path("/var/tmp")))
          assert all(os.statvfs(q).f_blocks*os.statvfs(q).f_frsize==capacity for q in
                     (Path("/tmp"),Path("/var/tmp")))
          paths=(scratch/"quota-root",Path("/tmp/quota-tmp"),Path("/var/tmp/quota-overflow"))
          before=os.statvfs(scratch).f_bavail*block
          try:
              with paths[0].open("xb") as a:
