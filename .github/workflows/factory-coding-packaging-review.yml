          sudo systemctl show "$unit" -p RuntimeMaxUSec -p KillMode -p Result -p ActiveState > "$ev/service-properties.txt"
          grep -Fx 'KillMode=control-group' "$ev/service-properties.txt"
          grep -Fx 'RuntimeMaxUSec=10min' "$ev/service-properties.txt"
