                  remain=os.statvfs(scratch).f_bavail*block
                  assert before-remain>=16*1024*1024 and remain>2*block
                  with paths[1].open("xb") as b:
                      os.posix_fallocate(b.fileno(),0,remain-block)
                      assert os.statvfs(scratch).f_bavail*block<=block
                      with paths[2].open("xb") as c:
                          try: os.posix_fallocate(c.fileno(),0,2*block)
                          except OSError as exc: assert exc.errno==errno.ENOSPC
                          else: raise AssertionError("aggregate quota did not reject overflow")
