name: KPI preflight regression tests

on:
  pull_request:
    paths:
      - 'enterprise/performance/kpi_preflight.py'
      - 'enterprise/performance/kpi-registry.yaml'
      - 'tests/test_kpi*.py'
      - 'tests/fixtures/kpi_pr43_schema_snapshot.json'
      - '.github/workflows/kpi-preflight-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kpi-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned schema and date-time format validators for test-only use
        run: python -m pip install 'jsonschema==4.26.0' 'rfc3339-validator==0.1.4'
      - name: Run KPI preflight regression tests
        run: python -m unittest discover -s tests -p 'test_kpi*.py' -v
