name: KPI preflight regression tests

on:
  pull_request:
    paths:
      - 'enterprise/performance/kpi_preflight.py'
      - 'tests/test_kpi*.py'
      - '.github/workflows/kpi-preflight-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kpi-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run KPI preflight regression tests
        run: python -m unittest discover -s tests -p 'test_kpi*.py' -v
