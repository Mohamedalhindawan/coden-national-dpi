name: OpenHands source build and provenance
on:
  pull_request:
    paths:
      - '.github/workflows/openhands-source-build.yml'
permissions: {}
jobs:
  build:
    if: github.event.repository.private == false && github.head_ref == 'audit/openhands-source-build' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      UPSTREAM: 077f3fad6d31cd852be5c87176e0a93c3b446126
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: OpenHands/software-agent-sdk
          ref: 077f3fad6d31cd852be5c87176e0a93c3b446126
          persist-credentials: false
      - name: Verify checked-out materials
        run: |
          test "$(git rev-parse HEAD)" = "$UPSTREAM"
          echo '71c5479cb609b60872a7cbd34da764a0804c2e50c2658dba1bb5255e180d3603  uv.lock' | sha256sum -c -
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.7'
          python-version: '3.13.9'
          enable-cache: false
      - name: Build the upstream PyInstaller specification from locked source
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-packages --dev
          spec=openhands-agent-server/openhands/agent_server/agent-server.spec
          uv run --offline --no-sync pyinstaller "$spec" > "$RUNNER_TEMP/freeze.log" 2>&1 || { tail -80 "$RUNNER_TEMP/freeze.log"; exit 1; }
          mkdir product
          cp dist/openhands-agent-server product/
          file product/openhands-agent-server | grep 'ELF 64-bit'
          git diff --exit-code HEAD -- uv.lock "$spec"
          uv pip list --format json > product/build-environment.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("product")
          def digest(path):
              with open(path, "rb") as f:
                  return hashlib.file_digest(f, "sha256").hexdigest()
          receipt = dict(upstream_repository="OpenHands/software-agent-sdk",
                         upstream_commit=os.environ["UPSTREAM"], lock_sha256=digest("uv.lock"),
                         spec_sha256=digest("openhands-agent-server/openhands/agent_server/agent-server.spec"),
                         binary_sha256=digest(root/"openhands-agent-server"),
                         environment_sha256=digest(root/"build-environment.json"),
                         ci_sha=os.environ["GITHUB_SHA"], run_id=os.environ["GITHUB_RUN_ID"],
                         python=subprocess.check_output([".venv/bin/python","--version"],text=True).strip(),
                         uv=subprocess.check_output(["uv","--version"],text=True).strip(),
                         agent_session_executed=False)
          (root/"materials.json").write_text(json.dumps(receipt,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openhands-source-product
          path: product/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  provenance:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openhands-source-product
          path: product
      - name: Bind binary and materials to this workflow identity
        id: attest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: 'product/*'
      - name: Independently verify the signed subjects and check build inputs
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir receipts
          cp "$BUNDLE" receipts/bundle.jsonl
          cp product/{materials,build-environment}.json receipts/
          for name in openhands-agent-server materials.json build-environment.json; do
            gh attestation verify "product/$name" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/openhands-source-build.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --format json > "receipts/$name.verify.json"
          done
          jq -e --arg sha "$GITHUB_SHA" '.upstream_commit == "077f3fad6d31cd852be5c87176e0a93c3b446126" and .ci_sha == $sha' product/materials.json
          echo "$(jq -r .binary_sha256 product/materials.json)  product/openhands-agent-server" | sha256sum -c -
          echo "$(jq -r .environment_sha256 product/materials.json)  product/build-environment.json" | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openhands-source-provenance
          path: receipts/
          if-no-files-found: error
          retention-days: 14
