name: CODEN P0 exact OS base dependency evidence
on:
  pull_request:
    paths: ['.github/workflows/factory-r2-os-base-evidence.yml']
permissions: {}
jobs:
  base-review:
    if: github.event.repository.private == false && github.head_ref == 'feat/factory-acceleration-batch01-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE: docker.io/library/ubuntu@sha256:9a04f13b3f80ef056361e30868593b1cfd2279fe19e4081cb93a90bf56819d6a
    steps:
      - name: Collect fixed base library and package evidence
        run: |
          set -euo pipefail
          mkdir -m 0700 evidence
          test "$(id -u)" -ne 0
          podman info --format json | jq -e '.host.security.rootless == true and .host.cgroupVersion == "v2"' >/dev/null
          podman pull --platform linux/amd64 "$BASE"
          podman image inspect "$BASE" > evidence/base-image.json
          jq -e '.[0].Architecture=="amd64"' evidence/base-image.json >/dev/null
          podman run --rm --pull=never --network none --http-proxy=false --read-only --read-only-tmpfs=false --cap-drop=all --security-opt=no-new-privileges --user 65534:65534 --cpus=2 --memory=512m --memory-swap=512m --pids-limit=64 --timeout=60 "$BASE" /bin/sh -eu -c '
            test "$(id -u)" = 65534
            test "$(ls /sys/class/net | tr "\n" " ")" = "lo "
            /sbin/ldconfig -p
            dpkg-query -W -f="\${binary:Package}\t\${Version}\t\${Architecture}\n"
          ' > evidence/base-cache-and-packages.txt
          podman run --rm --pull=never --network none --http-proxy=false --read-only --read-only-tmpfs=false --cap-drop=all --security-opt=no-new-privileges --user 65534:65534 --cpus=2 --memory=512m --memory-swap=512m --pids-limit=64 --timeout=60 "$BASE" /bin/sh -eu -c '
            missing=0
            for name in ld-linux-x86-64.so.2 libc.so.6 libdl.so.2 libgcc_s.so.1 libm.so.6 libpthread.so.0 librt.so.1 libstdc++.so.6 libutil.so.1 libz.so.1; do
              p=$(/sbin/ldconfig -p | awk -v n="$name" "\$1==n && /x86-64/ {print \$NF; exit}")
              if [ "$name" = ld-linux-x86-64.so.2 ] && [ -z "$p" ]; then p=/lib64/ld-linux-x86-64.so.2; fi
              if [ -z "$p" ] || [ ! -f "$p" ]; then printf "MISSING\t%s\n" "$name"; missing=1; continue; fi
              actual=$(readlink -f "$p")
              printf "FOUND\t%s\t%s\t%s\n" "$name" "$p" "$actual"
              sha256sum "$actual"
              dpkg-query -S "$p" "$actual" 2>&1 || true
            done
            test "$missing" -eq 0
          ' | tee evidence/required-library-files.txt
          test "$(grep -c '^FOUND' evidence/required-library-files.txt)" -eq 10
          printf '%s\n' '{"base_name_presence_verified":true,"recursive_resolution_verified":false,"symbol_compatibility_verified":false,"license_approved":false,"actual_build":false,"release_authorized":false}' > evidence/review.json
      - name: Review exact provider ELF versions and package copyright notices
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          name="coden-base-provider-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            rc=$?
            trap - EXIT
            podman rm -f --ignore "$name" >/dev/null || rc=1
            rm -rf "$work"
            exit "$rc"
          }
          trap cleanup EXIT
          podman create --name "$name" --pull=never --network none --read-only --cap-drop=all --security-opt=no-new-privileges --user 65534:65534 "$BASE" /bin/false >/dev/null
          mkdir -m 0700 evidence/provider-elf
          readelf --version > evidence/readelf-version.txt
          cat > "$work/expected.sha256" <<'EOF'
          c20a2dc8917c755f02b94049356320fe1f62ac7d9f8994731f807d9df39302da  ld-linux-x86-64.so.2
          3a15d66867d83762c7f2f1e37359cb8f6c5743edb369c65285cb0b1c4f7498bf  libc.so.6
          c2994527172cc23b7fb0f7d611b71e00a37da27af12c2e5e9e0dc1a742886c96  libdl.so.2
          d93224d2b0dab4247598be683adca02f5cf00586f99c187579cd7e92058fb7cb  libgcc_s.so.1
          fce00b6f25f459cf4ae0b7fae4257909a1a8a86f9149e7c029a5d617baf1ccd0  libm.so.6
          90491a21ce44efcf3bd4b65ec82501c091d7ebe7f8d9b341dd01d721001d9ecd  libpthread.so.0
          6d072187d88e092e81561a44c03a4a41397319022c6d43519757cc051c576d82  librt.so.1
          1fd75fe70354a416d75aef22bcae68c47bd25d20e2d0568c30b1a9838cf62f11  libstdc++.so.6.0.33
          5181d2b5de571bf054395684bfe77db685badf0163ac50b5e47d2148b52f11c3  libutil.so.1
          f61677c7bdb7c2aa2a243ea781bfd16afcb361cede7b4ef76127a9d8eb9a5242  libz.so.1.3
          EOF
          while read -r digest file; do
            podman cp "$name:/usr/lib/x86_64-linux-gnu/$file" "$work/$file"
            test -f "$work/$file" && test ! -L "$work/$file"
            (cd "$work"; printf '%s  %s\n' "$digest" "$file" | sha256sum -c -)
            LC_ALL=C readelf -W -h -d -V "$work/$file" > "evidence/provider-elf/$file.txt"
            test -s "evidence/provider-elf/$file.txt"
          done < "$work/expected.sha256"
          cp "$work/expected.sha256" evidence/provider-files.sha256
          test "$(find evidence/provider-elf -type f | wc -l)" -eq 10
          podman run --rm --pull=never --network none --http-proxy=false --read-only --read-only-tmpfs=false --cap-drop=all --security-opt=no-new-privileges --user 65534:65534 --cpus=2 --memory=512m --memory-swap=512m --pids-limit=64 --timeout=60 "$BASE" /bin/sh -eu -c '
            for package in libc6 libgcc-s1 libstdc++6 zlib1g; do
              p="/usr/share/doc/$package/copyright"
              printf "\n=== %s ===\n" "$package"
              dpkg-query -W "$package"
              if [ -f "$p" ]; then
                sha256sum "$p"
                cat "$p"
              else
                printf "NOTICE_MISSING: %s\n" "$package"
              fi
            done
          ' > evidence/provider-copyright.txt
          test -s evidence/provider-copyright.txt
          printf '%s\n' '{"provider_elf_records":10,"exact_provider_hashes_verified":true,"consumer_symbol_compatibility_verified":false,"recursive_resolution_verified":false,"legal_admission":false,"release_authorized":false}' > evidence/provider-review.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r2-os-base-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
