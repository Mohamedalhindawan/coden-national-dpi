name: AI Factory intake dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ai_factory/**'
      - 'tests/test_ai_factory_*.py'
      - 'tests/test_factory_acceleration_skills.py'
      - 'configs/factory_execution_skills_v0_1.json'
      - '.github/skills/factory-*/SKILL.md'
      - '.github/workflows/ai-factory-intake-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: ai-factory-intake-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify synthetic-only intake tests
        run: python -m unittest discover -s tests -p 'test_ai_factory_intake.py' -v
      - name: Validate 72 GitHub adoption candidates (read-only, no installation)
        shell: bash
        run: |
          python -m ai_factory.adopt_first_registry
          python - <<'PY'
          from ai_factory.adopt_first_registry import load_catalog, select
          items = load_catalog()
          assert len(items) == 72
          assert len(select(items, priority="P0")) == 23
          assert len(select(items, priority="P1")) == 33
          assert len(select(items, priority="P2")) == 16
          assert all(not x["enabled"] and not x["approved"] and not x["installed_by_registry"] for x in items)
          print("PASS: all 72 upstream source candidates indexed; 0 installed/approved/enabled by registry.")
          PY
      - name: Validate R29 factory-only requirements and 12 additional sources
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from ai_factory.r29_factory_scope import load
          data = load()
          assert len(data["requirements"]) == 47
          assert len(data["extra_sources"]) == 12
          assert data["combined_candidate_entries"] == 84
          assert dict(Counter(row["wave"] for row in data["requirements"])) == {"W0":19, "W1":12, "W2":5, "W3":8, "W4":3}
          assert all(not x["approved"] and not x["enabled"] and not x["installed"] for x in data["extra_sources"])
          print("PASS: R29 47 scoped requirements, 12 proposed source gaps, no new installations, no spending.")
          PY
      - name: Verify 11 immutable critical source snapshots (no install)
        shell: bash
        run: |
          python -m ai_factory.factory_source_locks
          python - <<'PY'
          from ai_factory.factory_source_locks import load
          rows = load()
          assert len(rows) == 11
          assert len({x["repo"] for x in rows}) == 6
          assert all(not x["approved_for_install"] and not x["runtime_enabled"] for x in rows)
          assert all(x["license_review"] == "pending" and x["security_review"] == "pending" for x in rows)
          print("PASS: 11 immutable GitHub source snapshots only; no admission, installation or spending.")
          PY
      - name: Prove all 84 source candidates are safely indexed inside ai_factory
        shell: bash
        run: |
          python -m ai_factory.factory_84_registry
          python -m ai_factory.factory_84_registry --requires ADD-13
          python - <<'PY'
          from collections import Counter
          from ai_factory.factory_84_registry import load, select
          rows = load()
          assert len(rows) == 84
          assert len({x["upstream_repo"].casefold() for x in rows}) == 76
          assert dict(Counter(x["priority"] for x in rows)) == {"P0": 26, "P1": 39, "P2": 19}
          assert len(select(rows, requires="ADD-13")) == 4
          assert all(x["admission"] == "proposed_only"
                     and x["pinned_commit"] is None
                     and x["license_review"] == "pending"
                     and x["security_review"] == "pending"
                     and x["installed"] is False
                     and x["approved"] is False
                     and x["enabled"] is False for x in rows)
          print("PASS: 84 indexed and linked, 0 admitted/installed/enabled by registry.")
          PY
      - name: Verify real 84-source admission review backlog (Qwen candidate remains QUARANTINED)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_factory_84_admission_review_report.py' -v
          python -m ai_factory.factory_84_admission_report --json > "$RUNNER_TEMP/coden-84-review-backlog.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads((Path(os.environ["RUNNER_TEMP"])/"coden-84-review-backlog.json").read_text())
          assert r["source_entries"] == 84
          assert r["unique_upstream_repositories"] == 76
          assert r["license_review_pending"] == 84
          assert r["security_review_pending"] == 84
          assert r["review_checks_pending"] == 168
          assert r["source_approval_pending"] == 84
          assert r["model_candidate_executed_by_report"] is False
          assert r["release_authorized"] is False
          assert r["source_catalog_modified"] is False
          assert r["paid_calls"] == 0
          print("PASS: actual CODEN 84-source review backlog = 168 checks; candidate execution denied.")
          PY
      - name: Retain real catalog review report for human verification only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coden-real-84-source-review-backlog
          path: ${{ runner.temp }}/coden-84-review-backlog.json
          if-no-files-found: error
          retention-days: 2
      - name: Prove all six DRAFT Agent Skills are present and cannot grant runtime execution
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_factory_acceleration_skills.py' -v
          python -m ai_factory.factory_skill_catalog
          python - <<'PY'
          from ai_factory.factory_skill_catalog import SKILLS, choose, load
          rows = load()
          assert len(rows) == 6
          assert set(SKILLS.values()) == {r["name"] for r in rows}
          for task in SKILLS:
              result = choose(task)
              assert result["execute_now"] is False
              assert result["release_authorized"] is False
              assert result["paid_calls_authorized"] is False
          assert all(r["status"] == "DRAFT_NOT_AUTO_ACTIVATED"
                     and r["installed_by_catalog"] is False
                     and r["runtime_invoked"] is False
                     and r["release_authorized"] is False for r in rows)
          print("PASS: 6 CODEN factory skills discovered; zero installs, model sessions, spending or releases.")
          PY
      - name: Demonstrate approval-gated plan (no execution)
        shell: bash
        run: |
          python - <<'PY'
          from ai_factory.intake import make_execution_plan
          task = {
              "id": "CODEN-CLOUD-DRYRUN-001",
              "title": "Review synthetic catalog demo",
              "description": "No real data or repository modification",
              "data_classification": "synthetic",
              "requested_actions": ["read_repository", "run_tests"],
          }
          plan = make_execution_plan(task)
          assert plan["status"] == "awaiting_human_approval"
          assert plan["execution_authorized"] is False
          assert plan["data_classification"] == "synthetic"
          print("PASS: synthetic task validated; human approval required; no execution authorized.")
          PY
      - name: Generate synthetic preview and review report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from ai_factory.patch_preview import preview_synthetic_patch

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "coden-ai-factory-preview"
          artifact_dir.mkdir(mode=0o700, exist_ok=True)
          with tempfile.TemporaryDirectory() as isolated:
              result = preview_synthetic_patch(isolated, "CODEN-CLOUD-DRYRUN-001")
              assert result["status"] == "preview_created", result
              preview = Path(isolated) / result["path"]
              assert preview.read_text(encoding="utf-8") == "CODEN demo task: CODEN-CLOUD-DRYRUN-001\n"
              (artifact_dir / "demo-task.txt").write_bytes(preview.read_bytes())
          report = {
              "task_id": "CODEN-CLOUD-DRYRUN-001",
              "result": "synthetic_preview_only",
              "repository_modified": False,
              "ai_model_invoked": False,
              "approval_to_execute": False,
              "preview_file": "demo-task.txt",
          }
          (artifact_dir / "review-report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
      - name: Generate human-review patch manifest
        shell: bash
        run: |
          python - <<'PY'
          import difflib
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "coden-ai-factory-preview"
          file = directory / "demo-task.txt"
          content = file.read_text(encoding="utf-8").splitlines(keepends=True)
          patch = "".join(difflib.unified_diff([], content, fromfile="/dev/null", tofile="b/demo-task.txt"))
          (directory / "proposed-change.diff").write_text(patch, encoding="utf-8")
          manifest = {
              "proposal_only": True,
              "source": "synthetic_demo",
              "files": ["demo-task.txt"],
              "github_write_permitted": False,
              "pull_request_created": False,
              "requires_human_review": True,
          }
          (directory / "review-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          assert patch.startswith("--- /dev/null")
          print("Review-only diff and manifest prepared.")
          PY
      - name: Upload preview for human review
        uses: actions/upload-artifact@v4
        with:
          name: coden-synthetic-preview
          path: ${{ runner.temp }}/coden-ai-factory-preview/
          retention-days: 1
          if-no-files-found: error
