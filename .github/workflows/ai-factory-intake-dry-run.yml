name: AI Factory intake dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ai_factory/**'
      - 'tests/test_ai_factory_*.py'
      - '.github/workflows/ai-factory-intake-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: ai-factory-intake-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify synthetic-only intake tests
        run: python -m unittest discover -s tests -p 'test_ai_factory_intake.py' -v
      - name: Demonstrate approval-gated plan (no execution)
        shell: bash
        run: |
          python - <<'PY'
          from ai_factory.intake import make_execution_plan
          task = {
              "id": "CODEN-CLOUD-DRYRUN-001",
              "title": "Review synthetic catalog demo",
              "description": "No real data or repository modification",
              "data_classification": "synthetic",
              "requested_actions": ["read_repository", "run_tests"],
          }
          plan = make_execution_plan(task)
          assert plan["status"] == "awaiting_human_approval"
          assert plan["execution_authorized"] is False
          assert plan["data_classification"] == "synthetic"
          print("PASS: synthetic task validated; human approval required; no execution authorized.")
          PY
      - name: Generate synthetic preview and review report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from ai_factory.patch_preview import preview_synthetic_patch

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "coden-ai-factory-preview"
          artifact_dir.mkdir(mode=0o700, exist_ok=True)
          with tempfile.TemporaryDirectory() as isolated:
              result = preview_synthetic_patch(isolated, "CODEN-CLOUD-DRYRUN-001")
              assert result["status"] == "preview_created", result
              preview = Path(isolated) / result["path"]
              assert preview.read_text(encoding="utf-8") == "CODEN demo task: CODEN-CLOUD-DRYRUN-001\n"
              (artifact_dir / "demo-task.txt").write_bytes(preview.read_bytes())
          report = {
              "task_id": "CODEN-CLOUD-DRYRUN-001",
              "result": "synthetic_preview_only",
              "repository_modified": False,
              "ai_model_invoked": False,
              "approval_to_execute": False,
              "preview_file": "demo-task.txt",
          }
          (artifact_dir / "review-report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
      - name: Generate human-review patch manifest
        shell: bash
        run: |
          python - <<'PY'
          import difflib
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "coden-ai-factory-preview"
          file = directory / "demo-task.txt"
          content = file.read_text(encoding="utf-8").splitlines(keepends=True)
          patch = "".join(difflib.unified_diff([], content, fromfile="/dev/null", tofile="b/demo-task.txt"))
          (directory / "proposed-change.diff").write_text(patch, encoding="utf-8")
          manifest = {
              "proposal_only": True,
              "source": "synthetic_demo",
              "files": ["demo-task.txt"],
              "github_write_permitted": False,
              "pull_request_created": False,
              "requires_human_review": True,
          }
          (directory / "review-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          assert patch.startswith("--- /dev/null")
          print("Review-only diff and manifest prepared.")
          PY
      - name: Upload preview for human review
        uses: actions/upload-artifact@v4
        with:
          name: coden-synthetic-preview
          path: ${{ runner.temp }}/coden-ai-factory-preview/
          retention-days: 1
          if-no-files-found: error
