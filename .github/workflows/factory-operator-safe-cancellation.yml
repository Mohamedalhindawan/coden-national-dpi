name: CODEN Factory Safe Operator Cancellation Real SQLite Proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ai_factory/durable_queue.py'
      - 'ai_factory/offline_worker.py'
      - 'ai_factory/factory_worker_recovery_status.py'
      - 'tests/test_factory_operator_cancellation.py'
      - 'tests/test_factory_worker_recovery_status.py'
      - 'docs/FACTORY_OPERATOR_SAFE_CANCELLATION.md'
      - '.github/workflows/factory-operator-safe-cancellation.yml'

permissions:
  contents: read

jobs:
  operator-cancel-contract:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/factory-operator-safe-cancellation-20261123' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout synthetic pilot without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test real SQLite cancellation and existing recovery contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_factory_operator_cancellation.py' -v
          python -m unittest discover -s tests -p 'test_factory_worker_recovery_status.py' -v
          python -m unittest discover -s tests -p 'test_durable_queue.py' -v
      - name: Independently prove cancellation is a request and not a process stop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ai_factory.durable_queue import DurableQueue
          from ai_factory.factory_worker_recovery_status import snapshot

          root = Path(os.environ["RUNNER_TEMP"]) / "coden-cancellation-synthetic"
          root.mkdir(mode=0o700)
          db = root / "queue.sqlite3"
          queue = DurableQueue(db)
          for task_id in ("queued_cancel", "leased_cancel", "later_task"):
              queue.enqueue(task_id, "feat/synthetic", "c"*40, "f"*64)
          before = queue.request_cancel("queued_cancel", now=100)
          assert before["status"] == "cancelled"
          assert before["attempts"] == 0
          lease = queue.claim("worker", now=101, lease_seconds=30)
          assert lease["task_id"] == "leased_cancel"
          notice = queue.request_cancel("leased_cancel", now=102)
          assert notice["status"] == "cancel_requested"
          assert notice["next_action"] == "operator_stop_and_reconcile"
          assert queue.claim("another", now=103)["task_id"] == "later_task"
          report = snapshot(db, now=104)
          assert report["cancelled_before_start"] == 1
          assert report["cancel_requested_active"] == 1
          assert report["manual_attention_total"] == 1
          assert report["cancellation_support"] == "REQUEST_ONLY_NO_PROCESS_TERMINATION"
          assert report["cancellation_process_termination_verified"] is False
          assert report["automatic_retry_authorized"] is False
          assert report["queue_modified"] is False
          assert report["release_authorized"] is False
          assert report["paid_calls"] == 0
          try:
              queue.finish("leased_cancel", lease["lease_token"],
                           "awaiting_human_review", now=104)
          except ValueError:
              pass
          else:
              raise AssertionError("cancel_requested must reject worker finish")
          assert queue.recover_expired(now=132) == 2
          assert queue.read("leased_cancel")["status"] == "needs_review"
          assert queue.read("queued_cancel")["status"] == "cancelled"
          assert queue.claim("future_worker", now=140) is None
          report["synthetic_cancel_expiry_quarantined_verified"] = True
          report["trusted_operator_process_stop_verified"] = False
          report["factory_v1_production_approved"] = False
          receipt = Path(os.environ["RUNNER_TEMP"]) / "coden-operator-cancellation-receipt.json"
          receipt.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PASS: real SQLite queued cancel, leased request, no finish, expiry quarantine, no replay.")
          PY
      - name: Preserve sanitized review evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coden-factory-safe-cancel-real-sqlite
          path: ${{ runner.temp }}/coden-operator-cancellation-receipt.json
          retention-days: 2
          if-no-files-found: error
