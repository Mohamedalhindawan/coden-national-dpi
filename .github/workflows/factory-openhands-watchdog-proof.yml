name: CODEN P0 OpenHands independent watchdog proof
on:
  pull_request:
    paths: ['.github/workflows/factory-openhands-watchdog-proof.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.event.repository.private == false && github.head_ref == 'feat/factory-p0-openhands-watchdog-proof-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE: docker.io/library/ubuntu@sha256:9a04f13b3f80ef056361e30868593b1cfd2279fe19e4081cb93a90bf56819d6a
      BINARY_SHA: 5ad5fa2bb86256b510df3bfbbd9653fbc60a243ea744a579d3ca4c6fd9e91cf3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45431783950
          name: openhands-source-product
          path: product
      - name: Recheck signature, exact product and archived security results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir evidence
          dir=docs/evidence/openhands-077f3fad
          echo "a86bac8c435a835697d8cfe3cee1f8c38ab4a99591b5af1fba6698686bfb7fd8  $dir/fixed-source-provenance.zip" | sha256sum -c -
          echo "684eba3009dc8885f9a3199220996083b32b139cab7d0a13fb63f6e2ac034760  $dir/fixed-source-audit.zip" | sha256sum -c -
          unzip -p "$dir/fixed-source-provenance.zip" bundle.jsonl > "$RUNNER_TEMP/bundle.jsonl"
          gh attestation verify product/openhands-agent-server --bundle "$RUNNER_TEMP/bundle.jsonl" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/openhands-source-build.yml" --source-digest d2c1cd0c41695205f868ff89faa318a80bb754de --deny-self-hosted-runners >/dev/null
          echo "$BINARY_SHA  product/openhands-agent-server" | sha256sum -c -
          for f in image-scan.json environment-scan.json; do
            unzip -p "$dir/fixed-source-audit.zip" "$f" | jq -e '(.Results|length>0) and ([.Results[] | .Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length==0)'
          done
      - name: Verify hard deadline on real OpenHands server and synthetic child
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          podman info --format json | jq -e '.host.security.rootless == true and .host.cgroupVersion == "v2" and (.host.cgroupControllers | contains(["cpu","memory","pids"]))' >/dev/null
          mkdir context
          install -m 0555 product/openhands-agent-server context/openhands-agent-server
          printf 'FROM %s\nCOPY openhands-agent-server /usr/local/bin/openhands-agent-server\nUSER 65534:65534\nENTRYPOINT ["/usr/local/bin/openhands-agent-server"]\nCMD []\n' "$BASE" > context/Dockerfile
          name="coden-watchdog-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="localhost/$name"
          tmp="$name-tmp"
          work="$name-work"
          cleanup() {
            rc=$?
            trap - EXIT
            podman rm -f --ignore "$name" >/dev/null 2>&1 || rc=1
            podman volume rm -f "$tmp" "$work" >/dev/null 2>&1 || rc=1
            podman image rm -f "$image" >/dev/null 2>&1 || rc=1
            if podman container exists "$name" || podman volume exists "$tmp" || podman volume exists "$work"; then rc=1; fi
            if [ "$rc" -eq 0 ]; then printf '%s\n' 'container_and_volumes_removed' > evidence/cleanup.txt; fi
            exit "$rc"
          }
          trap cleanup EXIT
          podman pull --platform linux/amd64 "$BASE"
          podman build --network none --pull=never -t "$image" context
          podman volume create --opt type=tmpfs --opt device=tmpfs --opt o=rw,exec,nosuid,nodev,size=768m,nr_inodes=32768,mode=1777 "$tmp"
          podman volume create --opt type=tmpfs --opt device=tmpfs --opt o=rw,noexec,nosuid,nodev,size=32m,nr_inodes=2048,uid=65534,gid=65534,mode=0700 "$work"
          podman create --name "$name" --network none --http-proxy=false --read-only --read-only-tmpfs=false \
            --cap-drop=all --security-opt=no-new-privileges --user 65534:65534 --cpus=1 \
            --memory=1536m --memory-swap=1536m --pids-limit=96 --cgroupns=private --pid=private --ipc=private \
            --timeout=60 --ulimit core=0:0 --volume "$tmp:/tmp:rw,nocopy" --volume "$work:/workspace:rw,nocopy" \
            --workdir /workspace --env HOME=/workspace --env XDG_CACHE_HOME=/workspace/cache \
            --env OPENHANDS_SUPPRESS_BANNER=1 "$image" --host 127.0.0.1 --port 8002
          podman inspect "$name" | jq -e '.[0].HostConfig | .NetworkMode=="none" and .ReadonlyRootfs==true and .Privileged==false and ((.PortBindings // {})|length==0)' >/dev/null
          start=$SECONDS
          podman start "$name" >/dev/null
          healthy=false
          for _ in $(seq 1 20); do
            if podman exec "$name" bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8002; printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -rt 3 line <&3; [[ "$line" == *" 200 "* ]]' 2>/dev/null; then healthy=true; break; fi
            sleep 1
          done
          test "$healthy" = true
          # Fixed operator-owned synthetic process, never model-selected.
          podman exec -d "$name" /bin/sleep 300
          podman exec "$name" bash -euc '
            test "$(id -u)" = 65534
            test "$(ls /sys/class/net)" = lo
            test "$(cat /sys/fs/cgroup/memory.max)" = 1610612736
            test "$(cat /sys/fs/cgroup/pids.max)" = 96
            read -r quota period < /sys/fs/cgroup/cpu.max
            test "$quota" = "$period"
            count=0
            child=0
            for exe in /proc/[0-9]*/exe; do
              target=$(readlink "$exe" || true)
              case "$target" in
                /usr/local/bin/openhands-agent-server) count=$((count+1));;
                */sleep) child=$((child+1));;
                *) continue;;
              esac
              proc="$(dirname "$exe")"
              cmp /proc/self/cgroup "$proc/cgroup"
              grep -Eq "^CapEff:[[:space:]]+0+$" "$proc/status"
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" "$proc/status"
            done
            test "$count" -ge 2
            test "$child" -ge 1
          '
          # Capture host-side PID identities before the independent Podman deadline.
          # /proc start time prevents PID reuse from appearing to be a survivor.
          podman top "$name" hpid | tail -n +2 > "$RUNNER_TEMP/watchdog-pids"
          python3 - "$RUNNER_TEMP/watchdog-pids" "$RUNNER_TEMP/watchdog-identities.json" <<'PY'
          import json, pathlib, sys
          ids = {}
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              pid = int(line.strip())
              stat = pathlib.Path(f"/proc/{pid}/stat").read_text()
              ids[pid] = stat[stat.rindex(")")+2:].split()[19]
          assert len(ids) >= 3
          pathlib.Path(sys.argv[2]).write_text(json.dumps(ids))
          PY
          timeout 75 podman wait "$name" > "$RUNNER_TEMP/watchdog-exit"
          elapsed=$((SECONDS-start))
          test "$elapsed" -ge 55
          test "$elapsed" -le 75
          test "$(podman inspect -f '{{.State.Running}}' "$name")" = false
          python3 - "$RUNNER_TEMP/watchdog-identities.json" "$elapsed" "$RUNNER_TEMP/watchdog-exit" <<'PY'
          import json, pathlib, sys
          ids = json.loads(pathlib.Path(sys.argv[1]).read_text())
          for pid, birth in ids.items():
              try:
                  stat = pathlib.Path(f"/proc/{pid}/stat").read_text()
              except FileNotFoundError:
                  continue
              assert stat[stat.rindex(")")+2:].split()[19] != birth, "original process survived"
          code = int(pathlib.Path(sys.argv[3]).read_text().strip())
          assert code != 0
          pathlib.Path("evidence/watchdog.json").write_text(json.dumps({
              "status": "deadline_verified", "deadline_seconds": 60,
              "elapsed_seconds": int(sys.argv[2]), "observed_processes": len(ids),
              "original_processes_gone": True, "container_running": False,
              "model_tool_executed": False, "sdk_conversation_ran": False,
              "release_authorized": False, "production_authorized": False
          }, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openhands-watchdog-review
          path: evidence/
          if-no-files-found: error
          retention-days: 7
