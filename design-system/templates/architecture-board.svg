<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CODEN Architecture Board Template</title>
  <desc id="desc">Editable 16 by 9 architecture board template using CODEN's provisional navy, blue, white and turquoise design palette.</desc>
  <defs>
    <style>
      .navy{fill:#0B2D4A}.blue{fill:#0878C9}.teal{fill:#00BFA6}.pale{fill:#E8F4FA}
      .ink{fill:#142536}.muted{fill:#607080}.line{stroke:#D7E1E8;stroke-width:2}
      .h1{font:700 38px Arial,sans-serif}.h2{font:700 23px Arial,sans-serif}
      .body{font:400 20px Arial,sans-serif}.small{font:400 15px Arial,sans-serif}
      .card{fill:#fff;stroke:#D7E1E8;stroke-width:2}.shadow{filter:none}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#F4F8FA"/>
  <rect x="0" y="0" width="1920" height="14" class="teal"/>
  <rect x="64" y="48" width="1792" height="120" rx="18" fill="#fff"/>
  <rect x="64" y="48" width="12" height="120" rx="6" class="navy"/>
  <circle cx="126" cy="108" r="35" fill="#E8F4FA" stroke="#0878C9" stroke-width="2"/>
  <path d="M112 128 L118 82 L134 82 L140 128 Z M115 92 L137 92 M120 79 L132 79" fill="none" stroke="#0B2D4A" stroke-width="4" stroke-linejoin="round"/>
  <text x="180" y="101" class="h1 navy">CODEN</text>
  <text x="180" y="132" class="small muted">ENTERPRISE ARCHITECTURE &amp; ENGINEERING</text>
  <text x="1818" y="92" text-anchor="end" class="small muted">ARCHITECTURE BOARD  |  v1.0</text>
  <text x="1818" y="128" text-anchor="end" class="small muted">TARGET / REFERENCE ARCHITECTURE</text>

  <text x="80" y="230" class="h1 navy">[DIAGRAM TITLE]</text>
  <text x="80" y="268" class="body muted">[One-sentence purpose, scope, and audience]</text>

  <rect x="80" y="310" width="1760" height="590" rx="18" class="card"/>
  <text x="112" y="354" class="h2 navy">SYSTEM BOUNDARY / ARCHITECTURE SCOPE</text>
  <line x1="112" y1="374" x2="1808" y2="374" class="line"/>

  <rect x="130" y="425" width="350" height="150" rx="14" class="pale" stroke="#0878C9" stroke-width="2"/>
  <text x="305" y="475" text-anchor="middle" class="h2 navy">[LAYER / DOMAIN 1]</text>
  <text x="305" y="515" text-anchor="middle" class="body ink">[Component / responsibility]</text>

  <rect x="785" y="425" width="350" height="150" rx="14" class="pale" stroke="#0878C9" stroke-width="2"/>
  <text x="960" y="475" text-anchor="middle" class="h2 navy">[LAYER / DOMAIN 2]</text>
  <text x="960" y="515" text-anchor="middle" class="body ink">[Component / responsibility]</text>

  <rect x="1440" y="425" width="350" height="150" rx="14" fill="#E5F8F5" stroke="#00BFA6" stroke-width="2"/>
  <text x="1615" y="475" text-anchor="middle" class="h2 navy">[LAYER / DOMAIN 3]</text>
  <text x="1615" y="515" text-anchor="middle" class="body ink">[Component / responsibility]</text>

  <path d="M480 500 H770 M755 485 L770 500 L755 515" fill="none" stroke="#0878C9" stroke-width="5"/>
  <path d="M1135 500 H1425 M1410 485 L1425 500 L1410 515" fill="none" stroke="#00BFA6" stroke-width="5"/>

  <rect x="130" y="640" width="1660" height="185" rx="14" fill="#F4F8FA" stroke="#D7E1E8" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="160" y="684" class="h2 navy">CROSS-CUTTING CONTROLS</text>
  <text x="160" y="730" class="body ink">[Identity &amp; access]   •   [Security &amp; privacy]   •   [Data governance]   •   [Observability]   •   [Human approval]</text>
  <text x="160" y="778" class="small muted">Use this area for controls that span multiple layers; show explicit boundaries and ownership.</text>

  <rect x="80" y="930" width="1760" height="82" rx="14" fill="#fff" stroke="#D7E1E8" stroke-width="2"/>
  <text x="112" y="965" class="small navy">LEGEND</text>
  <rect x="210" y="950" width="18" height="18" rx="4" class="navy"/><text x="240" y="965" class="small ink">Governance / trust</text>
  <rect x="430" y="950" width="18" height="18" rx="4" class="blue"/><text x="460" y="965" class="small ink">Platform / services</text>
  <rect x="660" y="950" width="18" height="18" rx="4" class="teal"/><text x="690" y="965" class="small ink">Flows / emphasis</text>
  <rect x="890" y="950" width="18" height="18" rx="4" fill="#D7E1E8"/><text x="920" y="965" class="small ink">External / supporting</text>
  <text x="1808" y="965" text-anchor="end" class="small muted">Owner: [TEAM]  •  Date: [YYYY-MM-DD]  •  Figure: [XX]</text>
  <text x="80" y="1050" class="small muted">CODEN Enterprise Operating &amp; Engineering Playbook  |  Design System 1.0 — provisional brand tokens; validate against approved logo assets.</text>
</svg>