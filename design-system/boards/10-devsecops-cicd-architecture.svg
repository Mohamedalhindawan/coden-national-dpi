<rect x="104" y="426" width="250" height="142" rx="12" fill="#EAF2F8" stroke="#C4D8E5"/><text x="229" y="462" class="ct" text-anchor="middle">1 · Commit</text><text x="229" y="491" class="sm" text-anchor="middle">Branch policy</text><text x="229" y="514" class="sm" text-anchor="middle">Signed / traceable change</text><text x="229" y="537" class="sm" text-anchor="middle">Peer review</text>
