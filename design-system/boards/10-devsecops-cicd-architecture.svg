<rect x="660" y="426" width="250" height="142" rx="12" fill="#E1F4F3" stroke="#79C9C5"/><text x="785" y="462" class="ct" text-anchor="middle">3 · Test</text><text x="785" y="491" class="sm" text-anchor="middle">Unit · Integration</text><text x="785" y="514" class="sm" text-anchor="middle">API · UI · E2E</text><text x="785" y="537" class="sm" text-anchor="middle">Performance checks</text>
