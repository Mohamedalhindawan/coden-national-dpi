<g filter="url(#s)"><rect x="76" y="696" width="1768" height="178" rx="18" fill="#fff" stroke="#9DBCD0" stroke-width="2"/></g>
<g>
<rect x="104" y="724" width="350" height="116" rx="12" fill="#EAF2F8" stroke="#C4D8E5"/><text x="279" y="759" class="ct" text-anchor="middle">Approval &amp; Change Gate</text><text x="279" y="789" class="sm" text-anchor="middle">Risk-based approval · Separation of duties</text><text x="279" y="812" class="sm" text-anchor="middle">Release window · Rollback readiness</text>
