<rect x="1494" y="426" width="322" height="142" rx="12" fill="#EAF2F8" stroke="#C4D8E5"/><text x="1655" y="462" class="ct" text-anchor="middle">6 · Release Candidate</text><text x="1655" y="491" class="sm" text-anchor="middle">Evidence bundle</text><text x="1655" y="514" class="sm" text-anchor="middle">Change record · Risk rating</text><text x="1655" y="537" class="sm" text-anchor="middle">Human approval when required</text>
</g>
