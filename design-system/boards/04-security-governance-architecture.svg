<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">CODEN Security and Governance Architecture</title>
<desc id="desc">Defense-in-depth governance architecture covering accountability, identity, data protection, secure engineering, runtime security, monitoring, response and assurance.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFE"/><stop offset="1" stop-color="#EAF2F8"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#102A43"/><stop offset="1" stop-color="#1B4A68"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102A43" flood-opacity=".10"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3984B8"/></marker>
 <style>
 text{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
text{font-family:Inter,Arial,sans-serif;fill:#18364F}.ey{font-size:15px;font-weight:700;letter-spacing:2px;fill:#5B7891}.h{font-size:38px;font-weight:750;fill:#102A43}.sub{font-size:18px;fill:#567188}.sec{font-size:16px;font-weight:750;letter-spacing:1px;fill:#fff}.ct{font-size:18px;font-weight:750;fill:#153B59}.bd{font-size:14px;fill:#46647D}.sm{font-size:14px;fill:#526B80}.tag{font-size:14px;font-weight:750;letter-spacing:1px}.arr{fill:none;stroke:#3984B8;stroke-width:2.5;marker-end:url(#arr)}</style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="12" fill="#19A6A6"/>
<text x="76" y="58" class="ey">CODEN  /  TRUST, RISK &amp; CONTROL</text>
<text x="76" y="112" class="h">Security &amp; Governance Architecture</text>
<text x="76" y="146" class="sub">Defense in depth: clear accountability, secure-by-design engineering and continuous assurance</text>
<g transform="translate(1510 48)"><rect width="334" height="74" rx="14" fill="#E5F1F8" stroke="#B8D3E5"/><text x="22" y="29" class="tag" fill="#176A91">ARCHITECTURE VIEW</text><text x="22" y="54" font-size="18" font-weight="750">TARGET STATE · CONCEPTUAL</text></g>
<!-- governance top -->
<g filter="url(#shadow)"><rect x="76" y="180" width="1768" height="112" rx="16" fill="url(#navy)"/></g>
<text x="104" y="218" class="sec">01  GOVERNANCE &amp; ACCOUNTABILITY</text>
<g fill="#244F6D" stroke="#5D829B">
 <rect x="104" y="235" width="270" height="40" rx="8"/><rect x="392" y="235" width="270" height="40" rx="8"/><rect x="680" y="235" width="270" height="40" rx="8"/><rect x="968" y="235" width="270" height="40" rx="8"/><rect x="1256" y="235" width="552" height="40" rx="8"/>
</g>
<g class="white" font-size="14" font-weight="650" text-anchor="middle">
 <text x="239" y="260">Board &amp; Executive Oversight</text><text x="527" y="260">Risk &amp; Compliance Ownership</text><text x="815" y="260">Security Policies &amp; Standards</text><text x="1103" y="260">Service / Data Owners</text><text x="1532" y="260">Risk Acceptance · Exceptions · Independent Assurance</text>
</g>
<!-- five pillars -->
<text x="76" y="340" class="ey">02  DEFENSE-IN-DEPTH CONTROL DOMAINS</text>
<g filter="url(#shadow)">
 <rect x="76" y="360" width="548" height="190" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="686" y="360" width="548" height="190" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="1296" y="360" width="548" height="190" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="76" y="574" width="548" height="190" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="686" y="574" width="548" height="190" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="1296" y="574" width="548" height="190" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
</g>
<!-- card 1 -->
<g><rect x="76" y="360" width="548" height="8" rx="4" fill="#236A9B"/><text x="104" y="405" class="ct">Identity &amp; Access Management</text><text x="104" y="438" class="bd">• Workforce and service identities</text><text x="104" y="463" class="bd">• SSO, MFA, RBAC / ABAC, privileged access</text><text x="104" y="488" class="bd">• Short-lived credentials and secret rotation</text><text x="104" y="523" class="sm">Zero-trust principles · Least privilege · Default deny</text></g>
<!-- card 2 -->
<g><rect x="686" y="360" width="548" height="8" rx="4" fill="#18A6A6"/><text x="714" y="405" class="ct">Data Protection &amp; Privacy</text><text x="714" y="438" class="bd">• Classification, ownership and retention</text><text x="714" y="463" class="bd">• Encryption in transit and at rest</text><text x="714" y="488" class="bd">• Consent, minimization, masking and deletion</text><text x="714" y="523" class="sm">Purpose limitation · Residency · Controlled sharing</text></g>
<!-- card 3 -->
<g><rect x="1296" y="360" width="548" height="8" rx="4" fill="#4B78A8"/><text x="1324" y="405" class="ct">Secure Software Supply Chain</text><text x="1324" y="438" class="bd">• Threat modeling and secure design reviews</text><text x="1324" y="463" class="bd">• Code, dependency and container scanning</text><text x="1324" y="488" class="bd">• SBOM, signed artifacts and provenance</text><text x="1324" y="523" class="sm">Protected branches · Reviewed changes · Reproducible builds</text></g>
<!-- card 4 -->
<g><rect x="76" y="574" width="548" height="8" rx="4" fill="#6A83A0"/><text x="104" y="619" class="ct">Platform &amp; Infrastructure Security</text><text x="104" y="652" class="bd">• Network segmentation and workload isolation</text><text x="104" y="677" class="bd">• Hardened configurations and patch management</text><text x="104" y="702" class="bd">• Backup protection and recovery controls</text><text x="104" y="737" class="sm">Secure baselines · Environment separation · Resilience</text></g>
<!-- card 5 -->
<g><rect x="686" y="574" width="548" height="8" rx="4" fill="#18A6A6"/><text x="714" y="619" class="ct">AI &amp; Agent Governance</text><text x="714" y="652" class="bd">• Agent identity, scope and tool permissions</text><text x="714" y="677" class="bd">• Prompt / output safeguards and data boundaries</text><text x="714" y="702" class="bd">• Human approval for high-impact actions</text><text x="714" y="737" class="sm">Evaluation · Traceability · Kill switch · Model risk review</text></g>
<!-- card 6 -->
<g><rect x="1296" y="574" width="548" height="8" rx="4" fill="#236A9B"/><text x="1324" y="619" class="ct">Monitoring, Detection &amp; Response</text><text x="1324" y="652" class="bd">• Centralized logs, metrics and security events</text><text x="1324" y="677" class="bd">• Alert triage, incident playbooks and escalation</text><text x="1324" y="702" class="bd">• Forensics, recovery and lessons learned</text><text x="1324" y="737" class="sm">Continuous monitoring · Evidence retention · Exercises</text></g>
<!-- assurance band -->
<g filter="url(#shadow)"><rect x="76" y="790" width="1768" height="150" rx="16" fill="#173F5F"/></g>
<text x="104" y="830" class="sec">03  ASSURANCE &amp; CONTROL LIFECYCLE</text>
<g fill="#244F6D" stroke="#5D829B">
 <rect x="104" y="850" width="300" height="64" rx="9"/><rect x="428" y="850" width="300" height="64" rx="9"/><rect x="752" y="850" width="300" height="64" rx="9"/><rect x="1076" y="850" width="300" height="64" rx="9"/><rect x="1400" y="850" width="408" height="64" rx="9"/>
</g>
<g class="white" text-anchor="middle"><text x="254" y="877" font-size="15" font-weight="700">Define</text><text x="254" y="898" font-size="12">Policies · Risk appetite · Owners</text><text x="578" y="877" font-size="15" font-weight="700">Prevent</text><text x="578" y="898" font-size="12">Identity · Secure defaults · Training</text><text x="902" y="877" font-size="15" font-weight="700">Detect</text><text x="902" y="898" font-size="12">Telemetry · Scanning · Alerts</text><text x="1226" y="877" font-size="15" font-weight="700">Respond &amp; Recover</text><text x="1226" y="898" font-size="12">Contain · Restore · Learn</text><text x="1604" y="877" font-size="15" font-weight="700">Assure &amp; Improve</text><text x="1604" y="898" font-size="12">Audit · Test · Remediate · Report</text></g>
<path d="M404 882H423 M728 882H747 M1052 882H1071 M1376 882H1395" fill="none" stroke="#55C8C1" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="76" y="960" width="1768" height="42" rx="9" fill="#E1F4F3" stroke="#79C9C5"/>
<text x="100" y="986" font-size="13" font-weight="750" fill="#087C80">NON-NEGOTIABLE PRINCIPLES</text><text x="360" y="986" class="bd">Accountability · Privacy by design · Least privilege · Separation of duties · Evidence-based assurance · Safe failure</text>
<line x1="76" y1="1020" x2="1844" y2="1020" stroke="#C5D6E1" stroke-width="1.5"/>
<text x="76" y="1050" class="sm">FIG. 04  ·  SECURITY &amp; GOVERNANCE</text><text x="960" y="1050" text-anchor="middle" class="sm">Conceptual target architecture · Tailor controls to applicable law, threat model and service criticality</text><text x="1844" y="1050" text-anchor="end" class="sm">DRAFT 1.0  |  16:9 SVG MASTER</text>
</svg>