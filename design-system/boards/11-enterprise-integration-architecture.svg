<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">CODEN Enterprise Integration Architecture</title>
<desc id="desc">Conceptual enterprise integration patterns, APIs, events, adapters, security and observability.</desc>
<defs>
 <linearGradient id="navy" x1="0" x2="1"><stop stop-color="#10243E"/><stop offset="1" stop-color="#183D63"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1769AA"/><stop offset="1" stop-color="#2389C9"/></linearGradient>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10243E" flood-opacity=".10"/></filter>
 <style>
 text{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

 .h1{font:700 38px Arial,sans-serif;fill:#10243E}.sub{font:18px Arial,sans-serif;fill:#526B80}.section{font:700 20px Arial,sans-serif;fill:#10243E}.label{font:700 17px Arial,sans-serif;fill:#173A5E}.body{font:15px Arial,sans-serif;fill:#536B80}.small{font:13px Arial,sans-serif;fill:#526B80}.white{fill:#fff}.line{stroke:#8AA4B8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#D8E4EC;stroke-width:1.5}
 </style>
</defs>
<rect width="1920" height="1080" fill="#F5F8FB"/>
<rect width="1920" height="12" fill="#20A6B2"/>
<text x="72" y="82" class="h1">CODEN | ENTERPRISE INTEGRATION ARCHITECTURE</text>
<text x="74" y="116" class="sub">Governed APIs • Event-driven exchange • Secure interoperability • Bounded system ownership</text>
<rect x="1510" y="48" width="338" height="48" rx="24" fill="#E8F4F7" stroke="#8CCBD0"/>
<text x="1679" y="78" text-anchor="middle" style="font:700 15px Arial;fill:#147A85;letter-spacing:1px">TARGET STATE • CONCEPTUAL</text>

<!-- participants -->
<text x="72" y="178" class="section">01  ECOSYSTEM SYSTEMS &amp; CHANNELS</text>
<g filter="url(#shadow)">
 <rect x="72" y="202" width="1776" height="112" rx="16" class="card"/>
</g>
<g>
 <rect x="92" y="222" width="250" height="72" rx="10" fill="#EDF4FA" stroke="#B9D0E1"/><text x="217" y="251" text-anchor="middle" class="label">TAMAM CHANNELS</text><text x="217" y="275" text-anchor="middle" class="small">Mobile • Web • Partner portal</text>
 <rect x="365" y="222" width="250" height="72" rx="10" fill="#EDF4FA" stroke="#B9D0E1"/><text x="490" y="251" text-anchor="middle" class="label">CODEN SERVICES</text><text x="490" y="275" text-anchor="middle" class="small">Products • Shared capabilities</text>
 <rect x="638" y="222" width="250" height="72" rx="10" fill="#EDF4FA" stroke="#B9D0E1"/><text x="763" y="251" text-anchor="middle" class="label">PUBLIC INSTITUTIONS</text><text x="763" y="275" text-anchor="middle" class="small">Ministries • Agencies • Local units</text>
 <rect x="911" y="222" width="250" height="72" rx="10" fill="#EDF4FA" stroke="#B9D0E1"/><text x="1036" y="251" text-anchor="middle" class="label">FINANCIAL NETWORK</text><text x="1036" y="275" text-anchor="middle" class="small">Banks • PSPs • Payment rails</text>
 <rect x="1184" y="222" width="250" height="72" rx="10" fill="#EDF4FA" stroke="#B9D0E1"/><text x="1309" y="251" text-anchor="middle" class="label">PARTNER ECOSYSTEM</text><text x="1309" y="275" text-anchor="middle" class="small">DPGs • NGOs • Providers</text>
 <rect x="1457" y="222" width="370" height="72" rx="10" fill="#EDF4FA" stroke="#B9D0E1"/><text x="1642" y="251" text-anchor="middle" class="label">EXTERNAL DATA &amp; SERVICE SOURCES</text><text x="1642" y="275" text-anchor="middle" class="small">Telecoms • Registries • Trusted sources</text>
</g>
<path d="M217 314 V345 M490 314 V345 M763 314 V345 M1036 314 V345 M1309 314 V345 M1642 314 V345 M217 345 H1642" class="line"/>
<path d="M960 345 V375" class="line"/><path d="M950 365 L960 377 L970 365" fill="none" stroke="#20A6B2" stroke-width="3"/>

<!-- integration backbone -->
<rect x="72" y="386" width="1776" height="170" rx="18" fill="url(#navy)" filter="url(#shadow)"/>
<text x="104" y="425" style="font:700 22px Arial;fill:#fff">02  GOVERNED INTEGRATION BACKBONE</text>
<text x="104" y="451" style="font:15px Arial;fill:#B9D1E3">Central policy and observability; distributed ownership remains with each source system</text>
<g>
 <rect x="104" y="470" width="300" height="64" rx="10" fill="#fff"/><text x="254" y="496" text-anchor="middle" class="label">API MANAGEMENT</text><text x="254" y="518" text-anchor="middle" class="small">Gateway • Catalog • Developer portal</text>
 <rect x="428" y="470" width="300" height="64" rx="10" fill="#EAF5FA"/><text x="578" y="496" text-anchor="middle" class="label">IDENTITY &amp; TRUST</text><text x="578" y="518" text-anchor="middle" class="small">OAuth2/OIDC • mTLS • Federation</text>
 <rect x="752" y="470" width="300" height="64" rx="10" fill="#EAF5FA"/><text x="902" y="496" text-anchor="middle" class="label">EVENT &amp; MESSAGE FABRIC</text><text x="902" y="518" text-anchor="middle" class="small">Broker • Topics • Schema registry</text>
 <rect x="1076" y="470" width="300" height="64" rx="10" fill="#EAF5FA"/><text x="1226" y="496" text-anchor="middle" class="label">WORKFLOW ORCHESTRATION</text><text x="1226" y="518" text-anchor="middle" class="small">BPM • Saga • Adapters</text>
 <rect x="1400" y="470" width="416" height="64" rx="10" fill="#DDF3F1"/><text x="1608" y="496" text-anchor="middle" class="label">POLICY &amp; CONTRACT CONTROL</text><text x="1608" y="518" text-anchor="middle" class="small">Consent • Purpose • Versioning • Quotas</text>
</g>

<!-- patterns -->
<text x="72" y="612" class="section">03  INTEGRATION PATTERNS</text>
<g filter="url(#shadow)">
 <rect x="72" y="636" width="850" height="184" rx="16" class="card"/>
 <rect x="944" y="636" width="904" height="184" rx="16" class="card"/>
</g>
<text x="104" y="676" class="label">SYNCHRONOUS &amp; REQUEST-RESPONSE</text>
<text x="104" y="707" class="body">• REST / selected GraphQL APIs for interactive service journeys</text>
<text x="104" y="735" class="body">• Webhooks for partner notifications and callback workflows</text>
<text x="104" y="763" class="body">• Batch / managed file exchange only where justified and controlled</text>
<text x="104" y="791" class="small">Apply authentication, authorization, validation, throttling and API versioning</text>
<text x="976" y="676" class="label">ASYNCHRONOUS &amp; PROCESS INTEGRATION</text>
<text x="976" y="707" class="body">• Events and messages for decoupled cross-system communication</text>
<text x="976" y="735" class="body">• Orchestration or choreography for multi-step business processes</text>
<text x="976" y="763" class="body">• Idempotency, bounded retries, dead-letter queues and compensation</text>
<text x="976" y="791" class="small">Use correlation IDs, explicit contracts and replay-safe consumers</text>

<!-- governance rail -->
<rect x="72" y="850" width="1776" height="142" rx="16" fill="#EAF1F6" stroke="#C9D9E4"/>
<text x="104" y="889" class="section">04  CROSS-CUTTING TRUST, OPERATIONS &amp; CONTROL</text>
<g>
 <text x="104" y="927" class="label">SECURITY &amp; PRIVACY</text><text x="104" y="953" class="small">Least privilege • Data minimization • Consent</text>
 <text x="520" y="927" class="label">INTEROPERABILITY</text><text x="520" y="953" class="small">Schema contracts • Canonical models • Federation</text>
 <text x="940" y="927" class="label">RESILIENCE</text><text x="940" y="953" class="small">Timeouts • Circuit breakers • Back-pressure</text>
 <text x="1325" y="927" class="label">OBSERVABILITY &amp; AUDIT</text><text x="1325" y="953" class="small">Logs • Metrics • Traces • SLA • Evidence</text>
</g>
<text x="72" y="1035" class="small">DESIGN PRINCIPLE: Avoid uncontrolled point-to-point meshes. Integrate through governed contracts and preserve authoritative ownership at source.</text>
<text x="1848" y="1035" text-anchor="end" class="small">CODEN • ARCHITECTURE SERIES 11</text>
</svg>