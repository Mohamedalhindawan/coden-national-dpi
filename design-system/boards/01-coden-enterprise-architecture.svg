<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">CODEN Enterprise Architecture — Target Operating Model</title>
<desc id="desc">Conceptual target architecture showing governance, four enterprise engines, shared platform capabilities, products and external ecosystem, with cross-cutting trust controls and human approval.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFE"/><stop offset="1" stop-color="#EDF4FA"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#102A43"/><stop offset="1" stop-color="#173F5F"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102A43" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#3984B8"/></marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#18A6A6"/></marker>
  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#18364F}
    .eyebrow{font-size:15px;font-weight:700;letter-spacing:2.2px;fill:#5B7891}
    .h1{font-size:39px;font-weight:750;fill:#102A43}
    .sub{font-size:18px;fill:#567188}
    .section{font-size:17px;font-weight:750;letter-spacing:1.2px;fill:#fff}
    .cardtitle{font-size:20px;font-weight:750;fill:#153B59}
    .body{font-size:15px;fill:#46647D}
    .small{font-size:13px;fill:#607D94}
    .tag{font-size:12px;font-weight:700;letter-spacing:1px}
    .white{fill:#fff}
    .line{fill:none;stroke:#3984B8;stroke-width:3;marker-end:url(#arrow)}
    .line2{fill:none;stroke:#18A6A6;stroke-width:3;marker-end:url(#arrow2)}
  </style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect x="0" y="0" width="1920" height="12" fill="#19A6A6"/>
<!-- Header -->
<text x="76" y="58" class="eyebrow">CODEN  /  ENTERPRISE ARCHITECTURE SERIES</text>
<text x="76" y="112" class="h1">Enterprise Architecture</text>
<text x="76" y="146" class="sub">A unified AI-native operating and engineering model for national digital public infrastructure</text>
