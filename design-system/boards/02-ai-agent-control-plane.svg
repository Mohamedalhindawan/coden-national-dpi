<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">CODEN AI Agent Control Plane Architecture</title>
<desc id="desc">Target-state control plane for agent registration, identity, policy, planning, execution, evaluation, human approval, audit and observability.</desc>
