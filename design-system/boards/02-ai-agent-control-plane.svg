 <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18A6A6"/></marker>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#18364F}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#5B7891}.h1{font-size:38px;font-weight:750;fill:#102A43}.sub{font-size:18px;fill:#567188}.section{font-size:16px;font-weight:750;letter-spacing:1px;fill:#fff}.ct{font-size:18px;font-weight:750;fill:#153B59}.body{font-size:14px;fill:#46647D}.small{font-size:12px;fill:#607D94}.tag{font-size:12px;font-weight:750;letter-spacing:1px}.white{fill:#fff}.flow{fill:none;stroke:#3984B8;stroke-width:2.8;marker-end:url(#a)}.flowt{fill:none;stroke:#18A6A6;stroke-width:2.8;marker-end:url(#t)}
 </style>
</defs>
