 <rect x="1366" y="688" width="478" height="130" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
</g>
<g>
 <rect x="76" y="688" width="414" height="8" rx="4" fill="#236A9B"/><text x="102" y="728" class="ct">Discovery &amp; Product Squad</text><text x="102" y="756" class="body">Research · Requirements · UX · Analysis</text><text x="102" y="788" class="tag" fill="#236A9B">SPECIFY THE RIGHT OUTCOME</text>
 <rect x="506" y="688" width="414" height="8" rx="4" fill="#18A6A6"/><text x="532" y="728" class="ct">Engineering Squad</text><text x="532" y="756" class="body">Implementation · Testing · Refactoring</text><text x="532" y="788" class="tag" fill="#087C80">BUILD &amp; VERIFY</text>
 <rect x="936" y="688" width="414" height="8" rx="4" fill="#4B78A8"/><text x="962" y="728" class="ct">Security &amp; Assurance Squad</text><text x="962" y="756" class="body">Threat review · Compliance · QA</text><text x="962" y="788" class="tag" fill="#315E8A">REDUCE RISK</text>
 <rect x="1366" y="688" width="478" height="8" rx="4" fill="#6A83A0"/><text x="1392" y="728" class="ct">Operations &amp; Knowledge Squad</text><text x="1392" y="756" class="body">SRE · Support · Documentation · Learning</text><text x="1392" y="788" class="tag" fill="#496681">OPERATE &amp; IMPROVE</text>
</g>
<!-- tool sandbox and quality -->
<g filter="url(#shadow)"><rect x="76" y="850" width="840" height="108" rx="14" fill="#EAF1F7" stroke="#B6CADA" stroke-width="2"/><rect x="936" y="850" width="908" height="108" rx="14" fill="#EAF1F7" stroke="#B6CADA" stroke-width="2"/></g>
<text x="102" y="884" class="ct">05  ISOLATED TOOL EXECUTION</text><text x="102" y="914" class="body">Scoped credentials · Sandboxed workspaces · Network controls · Secret broker</text><text x="102" y="938" class="small">No unrestricted shell, credentials, production writes or external actions by default</text>
<text x="962" y="884" class="ct">06  EVALUATION &amp; TELEMETRY</text><text x="962" y="914" class="body">Task success · Quality tests · Cost/latency · Safety events · Drift · Trace coverage</text><text x="962" y="938" class="small">Promote, pause, rollback or retire agents based on measured evidence</text>
