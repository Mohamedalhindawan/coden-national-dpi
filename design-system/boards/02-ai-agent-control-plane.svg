<g filter="url(#shadow)"><rect x="76" y="452" width="1768" height="170" rx="18" fill="#fff" stroke="#9DBCD0" stroke-width="2"/></g>
<rect x="76" y="452" width="1768" height="43" rx="16" fill="#173F5F"/>
<text x="104" y="480" class="section">03  CONTROL PLANE — POLICY-DRIVEN ORCHESTRATION</text>
<g>
 <rect x="104" y="516" width="250" height="78" rx="11" fill="#EAF2F8" stroke="#C4D8E5"/><text x="229" y="546" text-anchor="middle" class="ct">Request Intake</text><text x="229" y="570" text-anchor="middle" class="small">Goal · Context · Constraints</text>
 <rect x="380" y="516" width="250" height="78" rx="11" fill="#EAF2F8" stroke="#C4D8E5"/><text x="505" y="546" text-anchor="middle" class="ct">Policy &amp; Risk Engine</text><text x="505" y="570" text-anchor="middle" class="small">Scope · Data · Tool allowlist</text>
 <rect x="656" y="516" width="250" height="78" rx="11" fill="#EAF2F8" stroke="#C4D8E5"/><text x="781" y="546" text-anchor="middle" class="ct">Planner &amp; Router</text><text x="781" y="570" text-anchor="middle" class="small">Decompose · Select · Assign</text>
 <rect x="932" y="516" width="250" height="78" rx="11" fill="#EAF2F8" stroke="#C4D8E5"/><text x="1057" y="546" text-anchor="middle" class="ct">Workflow Runtime</text><text x="1057" y="570" text-anchor="middle" class="small">Queue · State · Retry · Timeout</text>
 <rect x="1208" y="516" width="250" height="78" rx="11" fill="#E1F4F3" stroke="#79C9C5"/><text x="1333" y="546" text-anchor="middle" class="ct">Approval Service</text><text x="1333" y="570" text-anchor="middle" class="small">Pause · Review · Resume</text>
 <rect x="1484" y="516" width="326" height="78" rx="11" fill="#E1F4F3" stroke="#79C9C5"/><text x="1647" y="546" text-anchor="middle" class="ct">Evidence &amp; Audit Ledger</text><text x="1647" y="570" text-anchor="middle" class="small">Inputs · Actions · Outputs · Actor</text>
</g>
<path d="M354 555H375 M630 555H651 M906 555H927 M1182 555H1203 M1458 555H1479" class="flow"/>
<!-- agent squads -->
<text x="76" y="666" class="eyebrow">04  EXECUTION LAYER — SPECIALIST AGENT SQUADS</text>
<g filter="url(#shadow)">
 <rect x="76" y="688" width="414" height="130" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="506" y="688" width="414" height="130" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
