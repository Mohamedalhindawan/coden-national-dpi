<text x="76" y="58" class="eyebrow">CODEN  /  AI GOVERNANCE &amp; ORCHESTRATION</text>
<text x="76" y="112" class="h1">AI Agent Control Plane</text>
<text x="76" y="146" class="sub">A governed control layer for registering, assigning, supervising and evaluating AI agents</text>
<g transform="translate(1510 48)"><rect width="334" height="74" rx="14" fill="#E5F1F8" stroke="#B8D3E5"/><text x="22" y="29" class="tag" fill="#176A91">ARCHITECTURE VIEW</text><text x="22" y="54" font-size="18" font-weight="750">TARGET STATE · CONCEPTUAL</text></g>
<!-- human governance -->
<g filter="url(#shadow)"><rect x="76" y="180" width="1768" height="94" rx="16" fill="url(#navy)"/></g>
<text x="104" y="216" class="section">01  HUMAN GOVERNANCE &amp; RISK OWNERSHIP</text>
<text x="104" y="247" class="white" font-size="16">Business owner · System owner · Security approver · Data owner · Service owner</text>
<g transform="translate(1440 199)"><rect width="166" height="54" rx="9" fill="#0E777C" stroke="#49C1BE"/><text x="83" y="22" text-anchor="middle" class="white" font-size="13" font-weight="700">APPROVAL GATE</text><text x="83" y="41" text-anchor="middle" class="white" font-size="11">HITL required</text></g>
<g transform="translate(1620 199)"><rect width="190" height="54" rx="9" fill="#244F6D" stroke="#5D829B"/><text x="95" y="22" text-anchor="middle" class="white" font-size="13" font-weight="700">AUDIT &amp; APPEAL</text><text x="95" y="41" text-anchor="middle" class="white" font-size="11">Traceable decisions</text></g>
<!-- registry -->
<g filter="url(#shadow)"><rect x="76" y="308" width="1768" height="106" rx="16" fill="#E1F4F3" stroke="#79C9C5" stroke-width="2"/></g>
<text x="104" y="342" font-size="17" font-weight="750" fill="#087C80">02  AGENT REGISTRY &amp; IDENTITY</text>
<g>
 <rect x="104" y="358" width="260" height="40" rx="8" fill="#fff" stroke="#B8DCD8"/><text x="234" y="383" text-anchor="middle" class="body">Agent catalogue &amp; owner</text>
