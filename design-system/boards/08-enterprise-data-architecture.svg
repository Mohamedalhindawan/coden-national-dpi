 <rect x="1366" y="806" width="478" height="8" rx="4" fill="#6A83A0"/><text x="1392" y="849" class="ct">Data Sharing &amp; APIs</text><text x="1392" y="880" class="bd">Purpose-bound access · Data products</text><text x="1392" y="900" class="sm">Controlled exchange with authorized partners</text>
