 <rect x="1366" y="358" width="478" height="8" rx="4" fill="#6A83A0"/><text x="1392" y="400" class="ct">Integration &amp; Contract Management</text><text x="1392" y="430" class="bd">Data contracts · Schema registry · Versioning</text><text x="1392" y="455" class="sm">Purpose, owner, source and access policy attached</text>
</g>
