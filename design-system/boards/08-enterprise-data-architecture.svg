<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">CODEN Enterprise Data Architecture</title>
<desc id="desc">Enterprise data architecture showing source systems, ingestion, governed data platform, data products, analytics and AI consumption, with security, quality, lineage and lifecycle governance.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFE"/><stop offset="1" stop-color="#EAF2F8"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#102A43"/><stop offset="1" stop-color="#1B4A68"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102A43" flood-opacity=".10"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3984B8"/></marker>
 <style>
 text{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

 text{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
text{font-family:Inter,Arial,sans-serif;fill:#18364F}.ey{font-size:15px;font-weight:700;letter-spacing:2px;fill:#5B7891}.h{font-size:38px;font-weight:750;fill:#102A43}.sub{font-size:18px;fill:#567188}.sec{font-size:15px;font-weight:750;letter-spacing:1px;fill:#fff}.ct{font-size:17px;font-weight:750;fill:#153B59}.bd{font-size:14px;fill:#46647D}.sm{font-size:14px;fill:#526B80}.tag{font-size:14px;font-weight:750;letter-spacing:1px}.arr{fill:none;stroke:#3984B8;stroke-width:2.5;marker-end:url(#arr)}</style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="12" fill="#19A6A6"/>
<text x="76" y="58" class="ey">CODEN  /  ENTERPRISE DATA &amp; INTELLIGENCE</text>
<text x="76" y="112" class="h">Enterprise Data Architecture</text>
<text x="76" y="146" class="sub">Governed data flows from operational systems into trusted products, analytics and AI-enabled decisions</text>
<g transform="translate(1510 48)"><rect width="334" height="74" rx="14" fill="#E5F1F8" stroke="#B8D3E5"/><text x="22" y="29" class="tag" fill="#176A91">ARCHITECTURE VIEW</text><text x="22" y="54" font-size="18" font-weight="750">TARGET STATE · CONCEPTUAL</text></g>
