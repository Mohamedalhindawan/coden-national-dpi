<path d="M1605 922V946H284V928" fill="none" stroke="#18A6A6" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#t)"/>
<rect x="76" y="954" width="1768" height="48" rx="10" fill="#E1F4F3" stroke="#79C9C5"/>
<text x="104" y="984" font-size="14" font-weight="750" fill="#087C80">CROSS-CUTTING CONTROLS</text>
<text x="360" y="984" class="body">Least privilege · Human accountability · Data protection · Reproducible builds · Artifact provenance · Cost controls · Auditability</text>
<line x1="76" y1="1020" x2="1844" y2="1020" stroke="#C5D6E1" stroke-width="1.5"/>
<text x="76" y="1050" class="small">FIG. 03  ·  AI ENGINEERING FACTORY</text>
<text x="960" y="1050" text-anchor="middle" class="small">Conceptual target architecture · Every release passes automated checks and defined approval gates</text>
<text x="1844" y="1050" text-anchor="end" class="small">DRAFT 1.0  |  16:9 SVG MASTER</text>
