<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">CODEN AI Engineering Factory Architecture</title>
<desc id="desc">Target-state software delivery pipeline from intake and discovery through specification, planning, implementation, verification, security gates, release and operations feedback.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFE"/><stop offset="1" stop-color="#EAF2F8"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#102A43"/><stop offset="1" stop-color="#1C4A6A"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102A43" flood-opacity=".10"/></filter>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3984B8"/></marker>
 <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18A6A6"/></marker>
 <style>
 text{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

 text{font-family:Inter,Arial,sans-serif;fill:#18364F}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#5B7891}.h1{font-size:38px;font-weight:750;fill:#102A43}.sub{font-size:18px;fill:#567188}.section{font-size:16px;font-weight:750;letter-spacing:1px;fill:#fff}.ct{font-size:18px;font-weight:750;fill:#153B59}.body{font-size:14px;fill:#46647D}.small{font-size:14px;fill:#526B80}.tag{font-size:14px;font-weight:750;letter-spacing:1px}.white{fill:#fff}.flow{fill:none;stroke:#3984B8;stroke-width:2.8;marker-end:url(#a)}.flowt{fill:none;stroke:#18A6A6;stroke-width:2.8;marker-end:url(#t)}
 </style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="12" fill="#19A6A6"/>
<text x="76" y="58" class="eyebrow">CODEN  /  SOFTWARE DELIVERY &amp; AI ENGINEERING</text>
<text x="76" y="112" class="h1">AI Engineering Factory</text>
<text x="76" y="146" class="sub">A repeatable, quality-gated production line for building and evolving secure digital products</text>
<g transform="translate(1510 48)"><rect width="334" height="74" rx="14" fill="#E5F1F8" stroke="#B8D3E5"/><text x="22" y="29" class="tag" fill="#176A91">ARCHITECTURE VIEW</text><text x="22" y="54" font-size="18" font-weight="750">TARGET STATE · CONCEPTUAL</text></g>
<!-- intake band -->
<g filter="url(#shadow)"><rect x="76" y="180" width="1768" height="100" rx="16" fill="url(#navy)"/></g>
<text x="104" y="217" class="section">01  PRODUCT INTAKE &amp; DISCOVERY</text>
<text x="104" y="249" class="white" font-size="16">Problem statement · User needs · Service owner · Business value · Constraints · Success measures</text>
<g transform="translate(1438 200)"><rect width="370" height="58" rx="10" fill="#244F6D" stroke="#5D829B"/><text x="185" y="24" text-anchor="middle" class="white" font-size="14" font-weight="700">HUMAN PRODUCT OWNER</text><text x="185" y="44" text-anchor="middle" class="white" font-size="12">Prioritizes and accepts outcomes</text></g>
<!-- specification -->
<text x="76" y="326" class="eyebrow">02  SPECIFICATION &amp; PLANNING</text>
<g filter="url(#shadow)">
 <rect x="76" y="348" width="410" height="124" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="506" y="348" width="410" height="124" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="936" y="348" width="410" height="124" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="1366" y="348" width="478" height="124" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
</g>
<g>
 <rect x="76" y="348" width="410" height="8" rx="4" fill="#236A9B"/><text x="102" y="391" class="ct">Research &amp; Requirements</text><text x="102" y="421" class="body">Discovery · Personas · Journeys</text><text x="102" y="446" class="body">Acceptance criteria · NFRs</text>
 <rect x="506" y="348" width="410" height="8" rx="4" fill="#18A6A6"/><text x="532" y="391" class="ct">Architecture &amp; Design</text><text x="532" y="421" class="body">ADRs · Threat model · UX/UI</text><text x="532" y="446" class="body">Data contracts · API contracts</text>
 <rect x="936" y="348" width="410" height="8" rx="4" fill="#4B78A8"/><text x="962" y="391" class="ct">Delivery Planning</text><text x="962" y="421" class="body">Epics · Tasks · Dependencies</text><text x="962" y="446" class="body">Estimates · Risk · Release plan</text>
 <rect x="1366" y="348" width="478" height="8" rx="4" fill="#6A83A0"/><text x="1392" y="391" class="ct">Approved Build Specification</text><text x="1392" y="421" class="body">Versioned, testable, traceable requirements</text><text x="1392" y="446" class="body">Ready only after owner and architecture review</text>
</g>
<!-- build pipeline -->
<g filter="url(#shadow)"><rect x="76" y="510" width="1768" height="220" rx="18" fill="#fff" stroke="#9DBCD0" stroke-width="2"/></g>
<rect x="76" y="510" width="1768" height="44" rx="16" fill="#173F5F"/>
<text x="104" y="539" class="section">03  AI-ASSISTED BUILD &amp; CONTINUOUS VERIFICATION PIPELINE</text>
<g>
 <rect x="104" y="580" width="250" height="112" rx="11" fill="#EAF2F8" stroke="#C4D8E5"/><text x="229" y="615" text-anchor="middle" class="ct">Repository Setup</text><text x="229" y="643" text-anchor="middle" class="small">Golden template · Branch</text><text x="229" y="664" text-anchor="middle" class="small">Dependencies · Environments</text>
 <rect x="380" y="580" width="250" height="112" rx="11" fill="#EAF2F8" stroke="#C4D8E5"/><text x="505" y="615" text-anchor="middle" class="ct">AI Implementation</text><text x="505" y="643" text-anchor="middle" class="small">Code · Config · Migrations</text><text x="505" y="664" text-anchor="middle" class="small">Docs · Small reviewed changes</text>
 <rect x="656" y="580" width="250" height="112" rx="11" fill="#EAF2F8" stroke="#C4D8E5"/><text x="781" y="615" text-anchor="middle" class="ct">Automated Testing</text><text x="781" y="643" text-anchor="middle" class="small">Unit · Integration · E2E</text><text x="781" y="664" text-anchor="middle" class="small">Contract · Accessibility</text>
 <rect x="932" y="580" width="250" height="112" rx="11" fill="#E1F4F3" stroke="#79C9C5"/><text x="1057" y="615" text-anchor="middle" class="ct">Security &amp; Quality Gates</text><text x="1057" y="643" text-anchor="middle" class="small">SAST · Secrets · Dependencies</text><text x="1057" y="664" text-anchor="middle" class="small">DAST · SBOM · Policy checks</text>
 <rect x="1208" y="580" width="250" height="112" rx="11" fill="#EAF2F8" stroke="#C4D8E5"/><text x="1333" y="615" text-anchor="middle" class="ct">Review &amp; Approval</text><text x="1333" y="643" text-anchor="middle" class="small">PR review · Evidence</text><text x="1333" y="664" text-anchor="middle" class="small">Human approval where required</text>
 <rect x="1484" y="580" width="326" height="112" rx="11" fill="#E1F4F3" stroke="#79C9C5"/><text x="1647" y="615" text-anchor="middle" class="ct">Release Candidate</text><text x="1647" y="643" text-anchor="middle" class="small">Signed artifact · Provenance</text><text x="1647" y="664" text-anchor="middle" class="small">Version · Rollback package</text>
</g>
<path d="M354 636H375 M630 636H651 M906 636H927 M1182 636H1203 M1458 636H1479" class="flow"/>
<!-- release and ops -->
<text x="76" y="778" class="eyebrow">04  RELEASE, OPERATE &amp; LEARN</text>
<g filter="url(#shadow)">
 <rect x="76" y="800" width="414" height="122" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="506" y="800" width="414" height="122" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="936" y="800" width="414" height="122" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
 <rect x="1366" y="800" width="478" height="122" rx="14" fill="#fff" stroke="#B9D3E4" stroke-width="2"/>
</g>
<g>
 <rect x="76" y="800" width="414" height="8" rx="4" fill="#236A9B"/><text x="102" y="844" class="ct">Progressive Deployment</text><text x="102" y="875" class="body">Dev → Test → Staging → Production</text><text x="102" y="899" class="small">Promotion gates and environment parity</text>
 <rect x="506" y="800" width="414" height="8" rx="4" fill="#18A6A6"/><text x="532" y="844" class="ct">Production Operations</text><text x="532" y="875" class="body">SLOs · Monitoring · Incident response</text><text x="532" y="899" class="small">Backups · Recovery · On-call ownership</text>
 <rect x="936" y="800" width="414" height="8" rx="4" fill="#4B78A8"/><text x="962" y="844" class="ct">Product Feedback</text><text x="962" y="875" class="body">User feedback · Usage · Service outcomes</text><text x="962" y="899" class="small">Defects · Requests · Operational learning</text>
 <rect x="1366" y="800" width="478" height="8" rx="4" fill="#6A83A0"/><text x="1392" y="844" class="ct">Continuous Improvement Backlog</text><text x="1392" y="875" class="body">Prioritized fixes · Enhancements · Tech debt</text><text x="1392" y="899" class="small">Evidence feeds the next discovery cycle</text>
</g>
