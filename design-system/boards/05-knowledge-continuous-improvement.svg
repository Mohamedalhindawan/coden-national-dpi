 <rect x="466" y="358" width="350" height="8" rx="4" fill="#18A6A6"/><text x="492" y="402" class="ct">Validate &amp; Curate</text><text x="492" y="434" class="bd">Quality · Deduplication · Review</text><text x="492" y="459" class="bd">Classification · Sensitivity labels</text><text x="492" y="484" class="sm">Owner, freshness and permitted use</text>
 <rect x="856" y="358" width="350" height="8" rx="4" fill="#4B78A8"/><text x="882" y="402" class="ct">Structure &amp; Link</text><text x="882" y="434" class="bd">Taxonomy · Ontologies · Entities</text><text x="882" y="459" class="bd">Relationships · Version history</text><text x="882" y="484" class="sm">Traceable links to authoritative sources</text>
 <rect x="1246" y="358" width="598" height="8" rx="4" fill="#6A83A0"/><text x="1272" y="402" class="ct">Knowledge Governance</text><text x="1272" y="434" class="bd">Named stewards · Access policies · Retention · Review cadence</text><text x="1272" y="459" class="bd">Approval workflow · Change history · Deletion and correction requests</text><text x="1272" y="484" class="sm">No source becomes trusted merely because it was ingested or indexed</text>
</g>
