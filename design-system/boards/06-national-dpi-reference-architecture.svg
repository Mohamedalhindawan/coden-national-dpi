<title id="title">CODEN National Digital Public Infrastructure Reference Architecture</title>
<desc id="desc">Layered national DPI reference architecture connecting channels, service delivery, shared platforms, registries and data exchange, trust and security, and foundational infrastructure under governance.</desc>
