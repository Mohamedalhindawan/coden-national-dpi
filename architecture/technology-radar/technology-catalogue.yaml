schema_version: "1.0"
document: "CODEN Enterprise Technology Catalogue"
status: "proposed_evaluation_baseline"
notice: "Entries are candidates for evaluation, not proof of approval, procurement, integration, or deployment."
radar_rings:
  adopt:
    meaning: "Preferred candidate default for a defined use case after validation."
  trial:
    meaning: "Time-boxed pilot in an approved sandbox with explicit success criteria."
  assess:
    meaning: "Research and fit evaluation; not a production standard."
  hold:
    meaning: "Avoid new commitments for a named use case pending documented review."
entries:
  - id: "DEV-001"
    name: "GitHub"
    category: "source_control"
    ring: "adopt"
    use_case: "Version control and pull-request review"
    validation_required: ["branch_protection", "least_privilege", "secret_scanning"]
  - id: "API-001"
    name: "OpenAPI"
    category: "api_contracts"
    ring: "adopt"
    use_case: "HTTP API description and contract"
    validation_required: ["schema_validation", "versioning", "contract_tests"]
  - id: "TEST-001"
    name: "pytest"
    category: "testing"
    ring: "adopt"
    use_case: "Python automated tests"
    validation_required: ["meaningful_coverage", "deterministic_execution"]
  - id: "TEST-002"
    name: "Playwright"
    category: "browser_testing"
    ring: "adopt"
    use_case: "Browser workflow and UI tests"
    validation_required: ["critical_journey_coverage", "stable_test_data"]
  - id: "PLAT-001"
    name: "Docker / OCI"
    category: "container_packaging"
    ring: "adopt"
    use_case: "Repeatable application packaging"
    validation_required: ["pinned_base_images", "image_scanning", "provenance"]
  - id: "IAC-001"
    name: "Terraform"
    category: "infrastructure_as_code"
    ring: "adopt"
    use_case: "Declarative infrastructure provisioning"
    validation_required: ["protected_state", "plan_review", "approval_controls"]
  - id: "OBS-001"
    name: "OpenTelemetry"
    category: "observability"
    ring: "adopt"
    use_case: "Vendor-neutral telemetry instrumentation"
    validation_required: ["sensitive_data_minimization", "retention_policy"]
  - id: "SUP-001"
    name: "CycloneDX or SPDX"
    category: "software_supply_chain"
    ring: "adopt"
    use_case: "Software bill of materials"
    validation_required: ["generated_from_build", "artifact_provenance"]
  - id: "AI-001"
    name: "Factory AI"
    category: "ai_engineering"
    ring: "trial"
    use_case: "Repository-native AI engineering execution"
    validation_required: ["benchmark_tasks", "reviewable_changes", "security_checks", "cost_measurement"]
  - id: "AI-002"
    name: "Manus AI"
    category: "ai_discovery"
    ring: "trial"
    use_case: "Research and specification assistance"
    validation_required: ["source_traceability", "human_validation", "rework_measurement"]
  - id: "AI-003"
    name: "Codex / OpenHands / Aider / Cline"
    category: "ai_coding_assistants"
    ring: "trial"
    use_case: "Compare assistants by bounded engineering task"
    validation_required: ["task_benchmark", "permission_review", "quality_and_cost_comparison"]
  - id: "WF-001"
    name: "n8n"
    category: "workflow_automation"
    ring: "trial"
    use_case: "Bounded integrations and human-in-the-loop workflows"
    validation_required: ["credential_isolation", "retry_tests", "auditability"]
  - id: "WF-002"
    name: "Temporal"
    category: "durable_workflows"
